apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bss

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: bss-platform
      app.kubernetes.io/name: web-portal
    includeSelectors: false
    includeTemplates: true
