apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: bss
  labels:
    app: product-catalog
    tier: backend
    tm-forum-api: tmf620
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: product-catalog
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: product-catalog
      # Giai đoạn 7, việc 8 (trivy config KSV-0118, HIGH) — xem comment đầy đủ ở
      # base/admin-console/deployment.yaml.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product-catalog
      # Giai đoạn 7 — xem comment đầy đủ ở customer-service/deployment.yaml.
      initContainers:
        - name: otel-agent-init
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:1.33.5
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: otel-agent, mountPath: /otel }
      containers:
        - name: app
          image: product-catalog:latest
          ports:
            - containerPort: 8080
              name: http
          # B-24: see the identical comment in customer-service/deployment.yaml.
          envFrom:
            - configMapRef:
                name: product-catalog-config
            - configMapRef:
                name: otel-common-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "product-catalog"
            # Giai đoạn 5 / B-20 — see the identical comment in customer-service/deployment.yaml.
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: product-db-credentials, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: product-db-credentials, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: product-db-credentials, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: product-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db-credentials
                  key: password
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: otel-agent, mountPath: /otel, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: otel-agent
          emptyDir: {}
