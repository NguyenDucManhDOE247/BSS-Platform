# Single ALB fronting the whole platform.
# Host names are filled per-env in overlays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bss-ingress
  namespace: bss
  annotations:
    # B-24: `kubernetes.io/ingress.class` is the deprecated way to pick a controller — the
    # modern field is `spec.ingressClassName` below. Kept both controllers usable from the same
    # base: AWS overlays patch `ingressClassName` to `alb` (unchanged behavior), the `local`
    # overlay patches it to `nginx`.
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    # B-23 / ADR-012: no certificate-arn — the ALB Controller discovers the ACM cert matching the rule
    # host (overlays set it). ExternalDNS creates the Route 53 alias record from that same host.
spec:
  ingressClassName: alb # overridden to "nginx" by overlays/local
  rules:
    - host: REPLACE_ME_HOST
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-console
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80
