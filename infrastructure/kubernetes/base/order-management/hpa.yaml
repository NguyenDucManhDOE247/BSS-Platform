apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-management
  namespace: bss
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-management
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
