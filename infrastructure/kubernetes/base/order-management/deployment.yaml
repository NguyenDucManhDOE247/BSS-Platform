apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management
  namespace: bss
  labels:
    app: order-management
    tier: backend
    tm-forum-api: tmf622
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-management
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: order-management
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: order-management
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order-management
      containers:
        - name: app
          image: order-management:latest
          ports:
            - { containerPort: 8080, name: http }
          # B-24: see the identical comment in customer-service/deployment.yaml — envFrom now
          # picks up every key of order-management-config (DB_URL, AWS_REGION, EVENT_BUS_NAME,
          # LOGGING_LEVEL_ROOT, ...) instead of only the 3 keys someone remembered to wire here.
          envFrom:
            - configMapRef:
                name: order-management-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: order-db-credentials, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: order-db-credentials, key: password }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
