apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: bss
  labels:
    app: customer-service
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-service
  namespace: bss
  # Workload Identity annotation set per-environment in overlays.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-service
  namespace: bss
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # avoid flapping
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customer-service
  namespace: bss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: customer-service
