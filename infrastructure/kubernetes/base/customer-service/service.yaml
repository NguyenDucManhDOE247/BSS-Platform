apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: bss
  labels:
    app: customer-service
    tier: backend # B-24: lets a single ServiceMonitor select every backend Service by label
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
