apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: bss
  labels:
    app: customer-service
    tier: backend
    tm-forum-api: tmf629
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # zero-downtime updates
  template:
    metadata:
      labels:
        app: customer-service
        tier: backend
      annotations:
        # Tell Prometheus to scrape this pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: customer-service  # uses IRSA (annotation set in overlays)
      # Spread pods across zones for resilience.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: customer-service
      containers:
        - name: app
          image: customer-service:latest  # overridden by kustomize per env
          ports:
            - containerPort: 8080
              name: http
          # B-24: was a hand-picked `env:` list that only ever wired DB_URL out of the
          # ConfigMap — every other literal in customer-service-config (LOG_LEVEL, AWS_REGION)
          # silently reached no one. envFrom loads EVERY key of the ConfigMap as an env var, so
          # adding a new literal to configMapGenerator (any overlay) actually takes effect
          # without also touching this file. Secrets stay as individual env: entries because
          # their key names (username/password) don't match the Spring property names
          # (DB_USER/DB_PASSWORD) the way the ConfigMap's keys already do.
          envFrom:
            - configMapRef:
                name: customer-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: password
          # Probes — without these, K8s can't make smart rollout decisions.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
