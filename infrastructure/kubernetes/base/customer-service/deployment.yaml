apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: bss
  labels:
    app: customer-service
    tier: backend
    tm-forum-api: tmf629
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # zero-downtime updates
  template:
    metadata:
      labels:
        app: customer-service
        tier: backend
      annotations:
        # Tell Prometheus to scrape this pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: customer-service  # uses IRSA (annotation set in overlays)
      # Giai đoạn 7, việc 8 (trivy config KSV-0118, HIGH) — xem comment đầy đủ ở
      # base/admin-console/deployment.yaml.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread pods across zones for resilience.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: customer-service
      # Giai đoạn 7: chép opentelemetry-javaagent.jar vào volume dùng chung — KHÔNG sửa code Java
      # nào, KHÔNG rebuild base image. Cùng kỹ thuật OTel Operator dùng để "auto-instrument", làm
      # tay ở đây vì cài cả Operator chỉ cho 5 Pod là quá nặng. Ghim version cùng lúc với
      # infrastructure/kubernetes/base/otel-config.yaml (đọc comment ở đó).
      initContainers:
        - name: otel-agent-init
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:1.33.5
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: otel-agent, mountPath: /otel }
      containers:
        - name: app
          image: customer-service:latest  # overridden by kustomize per env
          ports:
            - containerPort: 8080
              name: http
          # B-24: was a hand-picked `env:` list that only ever wired DB_URL out of the
          # ConfigMap — every other literal in customer-service-config (LOG_LEVEL, AWS_REGION)
          # silently reached no one. envFrom loads EVERY key of the ConfigMap as an env var, so
          # adding a new literal to configMapGenerator (any overlay) actually takes effect
          # without also touching this file. Secrets stay as individual env: entries because
          # their key names (username/password) don't match the Spring property names
          # (DB_USER/DB_PASSWORD) the way the ConfigMap's keys already do.
          envFrom:
            - configMapRef:
                name: customer-service-config
            # Giai đoạn 7: biến chung cho OTel Java agent (endpoint collector, propagator, tắt
            # exporter trùng…) — xem infrastructure/kubernetes/base/otel-config.yaml.
            - configMapRef:
                name: otel-common-config
          env:
            # OTEL_SERVICE_NAME là biến DUY NHẤT khác nhau giữa 5 service — mọi biến OTel còn lại
            # nằm trong otel-common-config (envFrom ở trên).
            - name: OTEL_SERVICE_NAME
              value: "customer-service"
            # Giai đoạn 5 / B-20: DB_HOST/DB_PORT/DB_NAME now travel the same path as
            # DB_USER/DB_PASSWORD — read from whatever produced the `customer-db-credentials`
            # Secret (Kustomize secretGenerator in overlays/local, AWS Secrets Store CSI sync in
            # overlays/dev) instead of a hand-typed DB_URL literal in a ConfigMap. See ADR-004.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-db-credentials
                  key: password
          # Probes — without these, K8s can't make smart rollout decisions.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: otel-agent
              mountPath: /otel
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: otel-agent
          emptyDir: {}
