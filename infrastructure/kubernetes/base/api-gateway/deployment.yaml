apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bss
  labels:
    app: api-gateway
    tier: edge
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: api-gateway
        tier: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: api-gateway
      # Giai đoạn 7, việc 8 (trivy config KSV-0118, HIGH) — xem comment đầy đủ ở
      # base/admin-console/deployment.yaml.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api-gateway }
      # Giai đoạn 7 — xem comment đầy đủ ở customer-service/deployment.yaml.
      initContainers:
        - name: otel-agent-init
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:1.33.5
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: otel-agent, mountPath: /otel }
      containers:
        - name: app
          image: api-gateway:latest
          ports:
            - { containerPort: 8080, name: http }
          # B-24: previously the only env var was a hardcoded SPRING_PROFILES_ACTIVE=aws, so
          # there was no way to give the gateway per-env config (e.g. LOGGING_LEVEL_ROOT) without
          # editing this file. api-gateway-config is added to every overlay's configMapGenerator.
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - configMapRef:
                name: otel-common-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          # Đo thật 2026-10-01 (dev EKS, 200→700 req/s — ADR-010 "7,9% lỗi"): thiếu timeoutSeconds = mặc định 1s.
          # CPU bão hòa ở limit → /actuator/health/liveness trả chậm > 1s → kubelet báo "context deadline
          # exceeded" 3 lần → GIẾT Pod đang phục vụ (exit 143) → ALB trả 502 cho request đang bay (1.902/79.364)
          # và Pod còn lại gánh thêm. Liveness chỉ nên giết Pod TREO THẬT, không phải Pod đang bận: 5s × 6 lần
          # (60s). Readiness 3s: bận thì tạm rút khỏi ALB, không bị giết. Áp cho mọi service JVM.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: otel-agent, mountPath: /otel, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: otel-agent, emptyDir: {} }
