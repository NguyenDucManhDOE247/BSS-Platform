apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bss
  labels:
    app: api-gateway
    tier: edge
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: api-gateway
        tier: edge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: api-gateway
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api-gateway }
      containers:
        - name: app
          image: api-gateway:latest
          ports:
            - { containerPort: 8080, name: http }
          # B-24: previously the only env var was a hardcoded SPRING_PROFILES_ACTIVE=aws, so
          # there was no way to give the gateway per-env config (e.g. LOGGING_LEVEL_ROOT) without
          # editing this file. api-gateway-config is added to every overlay's configMapGenerator.
          envFrom:
            - configMapRef:
                name: api-gateway-config
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
