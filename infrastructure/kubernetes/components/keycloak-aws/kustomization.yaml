# Giai đoạn 9 việc 7 (ADR-008 quyết định 6 + 8) — Keycloak trên EKS cho dev/staging/prod.
#
# Khác overlays/local/keycloak (kind):
#   • `start` (chế độ production) thay cho `start-dev`; DB là Postgres trên RDS (database + user riêng
#     "keycloak"/"keycloak_svc" do modules/rds tạo, db-bootstrap Job tạo trong Postgres) thay cho H2
#     trong emptyDir — user tự đăng ký KHÔNG mất khi Pod khởi động lại.
#   • Image riêng apps/identity/keycloak (`kc.sh build` lúc build → `start --optimized`, rootfs chỉ đọc)
#     do CD build/promote như 7 service kia; chạy được >1 replica (prod: 2) — ADR-011.
#   • Secret DB + admin lấy từ Secrets Manager qua CSI (ADR-004) — SecretProviderClass
#     `keycloak-credentials` ở overlays/<env>/secrets/ (tên secret có tiền tố môi trường).
#   • Đi qua ALB bằng HTTPS (B-23, ADR-012) nhưng CHỈ 2 path trình duyệt cần: /auth/realms (đăng nhập,
#     đăng ký, token, JWKS) và /auth/resources (CSS/JS của trang đăng nhập). Admin console /auth/admin
#     KHÔNG có route ra internet — quản trị đi bằng `kubectl port-forward` (docs/runbooks/auth.md).
#     NetworkPolicy: gateway + backend (JWKS) + subnet public của VPC (nơi ALB đặt ENI) được vào 8080.
#
# Overlay dùng component này phải: thêm SecretProviderClass `keycloak-credentials`, gắn IRSA role cho
# ServiceAccount `keycloak`, dùng kèm ../keycloak-realm (realm dùng chung, không có user), và đặt
# KC_HOSTNAME + path /auth/* trên Ingress + dải subnet public vào NetworkPolicy (xem overlays/dev).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml
