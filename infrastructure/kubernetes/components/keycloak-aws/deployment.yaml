apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: bss
  labels: { app: keycloak, tier: auth }
spec:
  # Mặc định 1 replica (dev, staging); overlays/prod đặt 2 (ADR-011). Chạy >1 replica được vì:
  #   • cache `ispn` (mặc định của `start`) + cache-stack `jdbc-ping` (mặc định Keycloak 26.x): các Pod
  #     tự tìm nhau qua CHÍNH database RDS (bảng JGROUPSPING) — không cần headless Service/DNS_PING;
  #   • session người dùng lưu bền trong DB (persistent user sessions, mặc định từ Keycloak 25) —
  #     1 Pod chết/khởi động lại, người dùng KHÔNG phải đăng nhập lại.
  # Đã kiểm thật (2026-09-30, 2 container + Postgres, rootfs chỉ đọc): "ISPN000094 … cluster view (2)",
  # refresh token cấp ở Pod 1 dùng được ở Pod 2.
  replicas: 1
  strategy:
    # Trước ADR-011 là Recreate (1 replica, sợ 2 phiên bản cùng migrate). Giờ RollingUpdate để prod
    # (2 replica) không mất đăng nhập khi deploy. Keycloak chỉ hỗ trợ rolling update giữa các bản
    # PATCH (26.7.x → 26.7.y); nâng MINOR/MAJOR (26.7 → 26.8) phải scale về 0 rồi mới lên — xem
    # docs/runbooks/auth.md mục "Nâng version Keycloak".
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak, tier: auth }
    spec:
      serviceAccountName: keycloak
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: keycloak } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: keycloak } }
      containers:
        - name: keycloak
          # Image riêng apps/identity/keycloak (đã `kc.sh build` sẵn) — placeholder `keycloak`, overlay
          # đổi thành <ECR>/bss/keycloak, CD đặt tag = commit cuối chạm apps/identity/keycloak (ADR-005).
          image: keycloak
          args: ["start", "--optimized", "--import-realm"]
          env:
            # Build option (db=postgres, health, metrics, /auth, management path) đã ĐÓNG BĂNG trong
            # image — không đặt lại ở đây (đặt khác giá trị sẽ làm `--optimized` từ chối khởi động).
            # ── DB: Postgres trên RDS, database + user riêng của Keycloak (least privilege, B-21) ──
            - name: KC_DB_URL_HOST
              valueFrom: { secretKeyRef: { name: keycloak-db, key: host } }
            - name: KC_DB_URL_PORT
              valueFrom: { secretKeyRef: { name: keycloak-db, key: port } }
            - name: KC_DB_URL_DATABASE
              valueFrom: { secretKeyRef: { name: keycloak-db, key: dbname } }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-db, key: username } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-db, key: password } }
            # ── Admin master realm: mật khẩu ngẫu nhiên do Terraform sinh → Secrets Manager → CSI ──
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            # ── Địa chỉ công khai (B-23, ADR-012 — thay ADR-008 quyết định 8) ──
            # KC_HOSTNAME là URL ĐẦY ĐỦ https://<host môi trường>/auth → `iss` của mọi token cố định là
            # https://<host>/auth/realms/bss, bất kể request đi vào bằng đường nào (trình duyệt qua ALB,
            # smoke qua port-forward, JWKS qua DNS nội bộ). Backend so khớp đúng chuỗi này
            # (…_JWT_ISSUER_URI ở overlay). Placeholder dưới đây CỐ Ý sai: mỗi overlay AWS phải ghi đè
            # (ci-k8s fail nếu bản render còn chữ REPLACE_ME).
            - { name: KC_HOSTNAME, value: "https://REPLACE_ME_HOST/auth" }
            # ALB kết thúc TLS rồi gọi Pod bằng HTTP; X-Forwarded-Proto/For cho Keycloak biết request gốc là
            # HTTPS + IP thật của khách. Thiếu dòng này: sslRequired=external (realm) thấy "HTTP từ IP lạ"
            # → trang đăng nhập trả "HTTPS required". Pod chỉ nhận traffic từ ALB + gateway/backend
            # (NetworkPolicy) nên không ai ngoài ALB giả được header này.
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_LOG_CONSOLE_OUTPUT, value: json } # CLAUDE.md §10: log JSON ở môi trường AWS
            # Lab mất 1 AZ (docs/labs/10-az-outage.md, 2026-10-02): khi RDS failover, kết nối cũ tới primary ở AZ
            # chết không nhận RST (gói tin mất hút) → treo tới timeout TCP của kernel (~15 phút) → mọi worker
            # thread kẹt chờ DB ("No executor queue space remaining", pool "Acquisition timeout") → health DOWN.
            # socketTimeout giới hạn mỗi lần đọc 30 s; tcpKeepAlive phát hiện kết nối chết khi đang rảnh.
            - { name: KC_DB_URL_PROPERTIES, value: "?socketTimeout=30&connectTimeout=10&tcpKeepAlive=true" }
            # Issue #217 — PHẢI đi cùng socketTimeout ở trên, cùng giá trị. Keycloak ≥ 26.8.0 gọi
            # connection.setNetworkTimeout(...) trên mỗi kết nối JDBC_PING2 mượn từ pool (keycloak/keycloak#51916);
            # khi trả kết nối, Agroal đặt lại network timeout theo cấu hình CỦA NÓ — mặc định 0 = vô hạn — và xóa
            # mất socketTimeout của pgjdbc. Health check DB sau đó đọc không timeout trên kết nối tới primary đã
            # chết → readiness DOWN tới khi kernel bỏ socket (~16 phút, đo trên prod). Đây là property thô của
            # Quarkus (Keycloak không có option kc.* tương ứng) → sau mỗi lần nâng Keycloak chạy lại
            # scripts/lab-keycloak-db-failover.sh (chưa sửa: không hồi phục trong 240 s; đã sửa: 26 s).
            - { name: QUARKUS_DATASOURCE_JDBC_NETWORK_TIMEOUT, value: "30S" }
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9000, name: management }
            # JGroups (cluster Infinispan giữa các Pod Keycloak): 7800 dữ liệu, 57800 = 7800 + 50000
            # dò lỗi node (FD_SOCK2). Kênh này mã hóa mTLS tự động (cache-embedded-mtls-enabled mặc định
            # true, chứng chỉ tạm tự xoay vòng). NetworkPolicy chỉ cho Pod Keycloak gọi nhau ở 2 cổng này.
            - { containerPort: 7800, name: jgroups }
            - { containerPort: 57800, name: jgroups-fd }
          # Không còn "augmentation" lúc khởi động → Pod lên trong vài giây khi DB đã có schema (đo thật:
          # 5.8s). Lần đầu trên RDS TRỐNG (mỗi lần dựng môi trường ephemeral, ADR-006) Keycloak còn phải
          # tạo schema + import realm → giữ trần 5 phút cho startupProbe.
          # ⚠️ Hai Pod cùng khởi động trên DB TRỐNG: Pod thứ hai có thể chết 1 lần vì tranh tạo bảng
          # Liquibase (lỗi thật đã tái hiện — `duplicate key … pg_type_typname_nsp_index`), kubelet khởi
          # động lại và nó vào cluster bình thường. Chỉ xảy ra lần deploy đầu của môi trường mới, không
          # xảy ra khi rolling update. Cách tránh hẳn là StatefulSet OrderedReady — xem ADR-011.
          startupProbe:
            httpGet: { path: /health/started, port: 9000 }
            periodSeconds: 10
            failureThreshold: 30
          # timeoutSeconds: mặc định 1 s quá ngắn khi Pod đang bận (bài học #203 với 5 service JVM) — lab AZ
          # thấy "context deadline exceeded" ở cả readiness của Keycloak.
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Đo trên kind (GĐ7/9) + EKS dev (GĐ9: 538Mi). Keycloak đặt heap = 70% limit mặc định.
            requests: { cpu: "250m", memory: "768Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            # ADR-011: bỏ ngoại lệ cũ (`false`) — image đã augment sẵn nên rootfs chỉ cần đọc. Chỗ Keycloak
            # cần ghi: /tmp và /opt/keycloak/data (emptyDir bên dưới).
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /opt/keycloak/data }
            - { name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true }
            # Mount CSI chỉ để driver sync 2 K8s Secret keycloak-db + keycloak-admin (secretObjects)
            # — Keycloak đọc chúng qua env, không đọc file.
            - { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: data, emptyDir: {} }
        - name: realm-import
          configMap: { name: keycloak-realm-bss } # ../keycloak-realm — KHÔNG có user thử
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: keycloak-credentials
