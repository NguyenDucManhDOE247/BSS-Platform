# Giai đoạn 5 / B-20: replaces platform/secrets/customer-secrets-spc.yaml's sample (which pointed
# at the RDS *master* secret — the very thing B-20/B-21 wanted to stop doing). This one points at
# customer-service's OWN least-privilege secret (bss-staging/rds/customer-service, user
# "customer_svc" — see modules/rds/main.tf's `service_databases` map and B-21).
#
# objectName uses the Secrets Manager secret NAME, not its ARN — the ARN has a random suffix
# AWS appends at creation time (e.g. "...-AbCdEf") that no static file checked into git could
# know in advance, but the NAME is fully deterministic from name_prefix ("bss-staging") + the
# service key, so it's safe to hardcode. The IRSA role bound to the customer-service
# ServiceAccount (see kustomization.yaml patches) must have secretsmanager:GetSecretValue on
# this exact secret — see the `customer-service` entry in
# infrastructure/terraform/environments/staging/main.tf's `module "iam"` block.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: customer-db-credentials
  namespace: bss
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "bss-staging/rds/customer-service"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "DB_USER"
          - path: "password"
            objectAlias: "DB_PASSWORD"
          - path: "host"
            objectAlias: "DB_HOST"
          - path: "port"
            objectAlias: "DB_PORT"
          - path: "dbname"
            objectAlias: "DB_NAME"
  # syncSecret (enabled cluster-wide in platform/secrets/secrets-store-csi-values.yaml) turns the
  # objects above into a real Kubernetes Secret named "customer-db-credentials" — same name/keys
  # the base Deployment's secretKeyRef already expects (env: DB_HOST/DB_PORT/DB_NAME/DB_USER/
  # DB_PASSWORD), so nothing else needs to know this Secret came from AWS instead of Kustomize's
  # secretGenerator (which is what overlays/local uses for the exact same Secret name/shape).
  secretObjects:
    - secretName: customer-db-credentials
      type: Opaque
      data:
        - objectName: DB_USER
          key: username
        - objectName: DB_PASSWORD
          key: password
        - objectName: DB_HOST
          key: host
        - objectName: DB_PORT
          key: port
        - objectName: DB_NAME
          key: dbname
