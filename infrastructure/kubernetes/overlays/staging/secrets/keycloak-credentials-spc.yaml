# Giai đoạn 9 việc 7 — secret của Keycloak (components/keycloak-aws), cùng cách với 4 service (ADR-004):
#   • staging/rds/keycloak   — database "keycloak" + user "keycloak_svc" (modules/rds, `service_databases`)
#   • staging/keycloak/admin — admin master realm, mật khẩu ngẫu nhiên do Terraform sinh
# (tiền tố thật là "bss-staging/…"). IRSA role bss-staging-keycloak chỉ đọc được đúng 2 secret này.
# secretObjects → 2 K8s Secret mà Deployment keycloak đọc qua env: keycloak-db, keycloak-admin.
# scripts/smoke.sh đọc keycloak-admin (qua kubectl, quyền deployer trong namespace bss) để tạo user smoke.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keycloak-credentials
  namespace: bss
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "bss-staging/rds/keycloak"
        objectType: "secretsmanager"
        jmesPath:
          - { path: "username", objectAlias: "KC_DB_USER" }
          - { path: "password", objectAlias: "KC_DB_PASSWORD" }
          - { path: "host", objectAlias: "KC_DB_HOST" }
          - { path: "port", objectAlias: "KC_DB_PORT" }
          - { path: "dbname", objectAlias: "KC_DB_NAME" }
      - objectName: "bss-staging/keycloak/admin"
        objectType: "secretsmanager"
        jmesPath:
          - { path: "username", objectAlias: "KC_ADMIN_USER" }
          - { path: "password", objectAlias: "KC_ADMIN_PASSWORD" }
  secretObjects:
    - secretName: keycloak-db
      type: Opaque
      data:
        - { objectName: KC_DB_USER, key: username }
        - { objectName: KC_DB_PASSWORD, key: password }
        - { objectName: KC_DB_HOST, key: host }
        - { objectName: KC_DB_PORT, key: port }
        - { objectName: KC_DB_NAME, key: dbname }
    - secretName: keycloak-admin
      type: Opaque
      data:
        - { objectName: KC_ADMIN_USER, key: username }
        - { objectName: KC_ADMIN_PASSWORD, key: password }
