# IRSA role name is always "${name_prefix}-${service_key}" = "bss-staging-db-bootstrap" (see the
# `module "iam"` block in environments/staging/main.tf and the identical pattern used by every other
# ServiceAccount's role-arn annotation in overlays/staging/kustomization.yaml). The account id below
# (132249065347) is this project's real, stable AWS account — see
# learning/nhat-ky-hoc-tap.md "Giai đoạn 4". Only the role's EXISTENCE depends on `terraform
# apply` having run; the ARN string itself was never actually unknowable — confirm after apply
# with `terraform -chdir=infrastructure/terraform/environments/staging output -json
# service_role_arns | jq -r '.["db-bootstrap"]'` if you want to double check it matches.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-bootstrap
  namespace: bss
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::132249065347:role/bss-staging-db-bootstrap"
