# Giai đoạn 7, việc 6 (B-18) dựng Keycloak ở overlay `local` (kind). Giai đoạn 9 việc 2 sửa lại
# địa chỉ theo ADR-008 quyết định 2. dev/staging/prod: Giai đoạn 9 việc 7.
#
# `KC_HOSTNAME` = ĐỊA CHỈ CÔNG KHAI mà trình duyệt thấy (`http://bss.localhost/auth`), không phải
# DNS nội bộ cluster. Keycloak ghi đúng chuỗi này vào claim `iss` của MỌI token, bất kể client gọi
# tới qua đường nào — nên `iss` vẫn là 1 giá trị duy nhất.
# Giai đoạn 7 từng đặt `KC_HOSTNAME` = DNS nội bộ (`keycloak.bss.svc.cluster.local`) để gateway khớp
# `iss`. Cách đó chạy được với `curl` + password grant, nhưng HỎNG với luồng đăng nhập của trình
# duyệt: Keycloak chuyển hướng người dùng tới chính địa chỉ nội bộ đó, trình duyệt không mở được.
# Gateway/service giờ tách 2 việc: so khớp `iss` với địa chỉ công khai, nhưng TẢI KHÓA (JWKS) qua
# DNS nội bộ (xem api-gateway-config trong ../kustomization.yaml). Pod không bao giờ phải tự
# resolve `bss.localhost` (trong Pod tên đó trỏ về 127.0.0.1 = chính Pod).
#
# Path `/auth` cùng origin với 2 website, không dùng subdomain `auth.bss.localtest.me` như GĐ7:
# trên AWS chưa có domain nên không tạo được subdomain trên DNS của ALB; path chạy y hệt ở kind
# lẫn AWS, và cùng origin thì không cần CORS cho lời gọi token. Lần thử path ở GĐ7 hỏng vì chỉ đặt
# 1 trong 2 biến — `KC_HOSTNAME` (quyết định `iss`) và `KC_HTTP_RELATIVE_PATH` (quyết định đường
# HTTP thật) PHẢI cùng mang `/auth`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: bss
  labels:
    app: keycloak
    tier: edge # dùng chung allow-public-ingress (base/network-policies, Giai đoạn 7 việc 5) khi PR đó đã merge
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak, tier: edge }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.5 # cùng bản với apps/identity/keycloak/Dockerfile (ADR-011 — 26.5 có CVE-2026-18963)
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: "http://bss.localhost/auth"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            # Nếu không đặt, cổng quản trị 9000 THỪA KẾ `/auth` từ KC_HTTP_RELATIVE_PATH → probe
            # `/health/ready` sẽ 404. Giữ `/` để probe bên dưới không phải đổi.
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: "/"
            # Cho phép lời gọi từ TRONG cluster (script E2E lấy token, tải JWKS) dùng địa chỉ nội bộ
            # cho các URL backchannel. Claim `iss` vẫn luôn là KC_HOSTNAME công khai.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9000, name: management }
          # Bug thật gặp khi deploy lần đầu: Keycloak 26.x phục vụ /health/* trên PORT QUẢN TRỊ
          # RIÊNG (9000, "Management interface" — thấy rõ trong log khởi động), KHÔNG phải cổng
          # ứng dụng 8080. Trỏ probe vào 8080 khiến kubelet nhận HTTP 404 (cổng 8080 vẫn trả lời,
          # chỉ là không có route đó) — khác hẳn "connection refused" (sẽ thấy nếu cổng sai hẳn),
          # dấu hiệu để phân biệt 2 loại lỗi này trong tương lai.
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20 # Quarkus + import realm lần đầu có thể mất > 30s
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "768Mi" } # JVM Quarkus — nhẹ hơn Spring Boot nhưng vẫn cần kha khá RAM lúc khởi động
            limits: { cpu: "1000m", memory: "1Gi" }
          # Bug thật gặp khi deploy lần đầu: `readOnlyRootFilesystem: true` (mọi container khác
          # trong repo đều dùng) làm Keycloak CrashLoop ngay — `start-dev --import-realm` kích
          # hoạt bước "augmentation" của Quarkus (build runner jar LÚC KHỞI ĐỘNG, ghi thẳng vào
          # /opt/keycloak/lib/quarkus/…, KHÔNG phải /opt/keycloak/data), lỗi thật:
          # `java.nio.file.ReadOnlyFileSystemException`. Đây là đặc thù riêng của "dev mode" —
          # ảnh production đúng cách chạy `kc.sh build` NGAY LÚC BUILD IMAGE (đóng gói sẵn 1 bản
          # đã "augment") rồi `kc.sh start` (không "-dev") lúc runtime KHÔNG cần ghi gì vào
          # rootfs — readOnlyRootFilesystem hoạt động bình thường với cách đó. Không làm ở đây vì
          # Keycloak này chỉ phục vụ kiểm thử cục bộ trên kind, không phải để chạy production.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # image quay.io/keycloak đã mặc định UID 1000 — xác nhận bằng `docker run ... id`
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: data, mountPath: /opt/keycloak/data }
            - { name: tmp, mountPath: /tmp }
            - { name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        # Realm (dùng chung mọi môi trường) + user thử (chỉ local) gộp vào 1 thư mục import.
        - name: realm-import
          projected:
            sources:
              - configMap: { name: keycloak-realm-bss }
              - configMap: { name: keycloak-realm-users }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: bss
  labels: { app: keycloak, tier: edge }
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
