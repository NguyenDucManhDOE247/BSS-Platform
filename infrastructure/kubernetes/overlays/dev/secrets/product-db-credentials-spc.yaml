# Giai đoạn 5 / B-20 — see the identical comment in customer-db-credentials-spc.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: product-db-credentials
  namespace: bss
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "bss-dev/rds/product-catalog"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "DB_USER"
          - path: "password"
            objectAlias: "DB_PASSWORD"
          - path: "host"
            objectAlias: "DB_HOST"
          - path: "port"
            objectAlias: "DB_PORT"
          - path: "dbname"
            objectAlias: "DB_NAME"
  secretObjects:
    - secretName: product-db-credentials
      type: Opaque
      data:
        - objectName: DB_USER
          key: username
        - objectName: DB_PASSWORD
          key: password
        - objectName: DB_HOST
          key: host
        - objectName: DB_PORT
          key: port
        - objectName: DB_NAME
          key: dbname
