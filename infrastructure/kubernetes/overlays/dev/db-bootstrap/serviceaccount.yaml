# IRSA role ARN comes from `terraform output` after `environments/dev` has been applied (the
# "db-bootstrap" entry added to module "iam"'s `services` map — see environments/dev/main.tf) —
# it can't be known statically here, same reason other roles in this repo use a CHANGE_ME
# placeholder (see infrastructure/kubernetes/base/*/serviceaccount.yaml). Fill it in with:
#   terraform -chdir=infrastructure/terraform/environments/dev output -json service_role_arns \
#     | jq -r '.["db-bootstrap"]'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-bootstrap
  namespace: bss
  annotations:
    eks.amazonaws.com/role-arn: "CHANGE_ME_DB_BOOTSTRAP_ROLE_ARN"
