apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bss

resources:
  - ../../base
  # Giai đoạn 5 / B-20: 4 SecretProviderClass, one per service's own least-privilege RDS user —
  # see infrastructure/kubernetes/overlays/dev/secrets/ and ADR-004.
  - secrets

# Image tags: the `newTag: dev` values below are only placeholders. CD (Giai đoạn 6, ADR-005) never
# edits this file: it generates a throwaway kustomization (`scripts/release-manifest.sh render`,
# under infrastructure/kubernetes/rendered/, gitignored) that stacks `images:` with the real tag of
# every service on top of this overlay, matching by the FULL name set by `newName` below.
# AWS account id below (132249065347) is this project's real, already-created AWS account — see
# learning/nhat-ky-hoc-tap.md "Giai đoạn 4" and memory `bss-platform-phase0-decisions`. It's a
# stable value (the account itself doesn't get destroyed/recreated by `terraform destroy` — only
# the resources inside it do), unlike the RDS hostname or SQS queue URL used to be here (B-20/
# ADR-004 moved those to flow from Secrets Manager instead of being hand-copied into this file).
images:
  - name: customer-service
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/customer-service
    newTag: dev
  - name: product-catalog
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/product-catalog
    newTag: dev
  - name: order-management
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/order-management
    newTag: dev
  - name: billing-service
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/billing-service
    newTag: dev
  - name: api-gateway
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/api-gateway
    newTag: dev
  - name: web-portal
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/web-portal
    newTag: dev
  - name: admin-console
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/admin-console
    newTag: dev

configMapGenerator:
  # Giai đoạn 5 / B-20: DB_URL literal removed from all 4 — DB_HOST/DB_PORT/DB_NAME now come from
  # each service's own SecretProviderClass (overlays/dev/secrets/), same as DB_USER/DB_PASSWORD
  # already did. See ADR-004 for why (no more hand-copying the RDS endpoint into this file).
  - name: customer-service-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=DEBUG
      - AWS_REGION=ap-southeast-1
  - name: product-catalog-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=DEBUG
      - AWS_REGION=ap-southeast-1
  - name: order-management-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=DEBUG
      - AWS_REGION=ap-southeast-1
      - EVENT_BUS_NAME=bss-dev-events
  - name: billing-service-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=DEBUG
      - AWS_REGION=ap-southeast-1
      # Giai đoạn 5: real queue URL — account id is stable (see note on `images:` above), queue
      # name is "${name_prefix}-billing-orders" = "bss-dev-billing-orders" (modules/eventbridge's
      # `consumers` map key, see infrastructure/terraform/modules/eventbridge/variables.tf).
      - SQS_QUEUE_URL=https://sqs.ap-southeast-1.amazonaws.com/132249065347/bss-dev-billing-orders
  # B-24: api-gateway used to hardcode SPRING_PROFILES_ACTIVE in the base Deployment with no
  # ConfigMap at all — now envFrom reads this like every other backend.
  - name: api-gateway-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=DEBUG

# Dev runs 1 replica each to save cost.
replicas:
  - { name: customer-service,  count: 1 }
  - { name: product-catalog,   count: 1 }
  - { name: order-management,  count: 1 }
  - { name: billing-service,   count: 1 }
  - { name: api-gateway,       count: 1 }
  - { name: web-portal,        count: 1 }
  - { name: admin-console,     count: 1 }

patches:
  # Giai đoạn 6: the CD deployer (bss-github-deployer-dev) only has a NAMESPACE-scoped EKS access
  # policy on `bss` (B-34, least privilege). A Namespace is a cluster-scoped object, so
  # `kubectl apply` of it as that role is Forbidden — and the whole apply fails. The namespace is
  # created once per cluster by `scripts/platform-install.sh` (run by an admin, with the Pod
  # Security labels from base/namespace.yaml); this patch drops it from what CD applies. base/ still
  # contains it, so overlays/local (kind) keeps creating it as before.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bss

  # IRSA bindings — one IAM role per service, scoped to the resources it needs (see `module
  # "iam"` in infrastructure/terraform/environments/dev/main.tf; role name is always
  # "${name_prefix}-${service_key}" = "bss-dev-<service>").
  - target: { kind: ServiceAccount, name: customer-service }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-dev-customer-service }
  - target: { kind: ServiceAccount, name: product-catalog }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-dev-product-catalog }
  - target: { kind: ServiceAccount, name: order-management }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-dev-order-management }
  - target: { kind: ServiceAccount, name: billing-service }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-dev-billing-service }

  # Giai đoạn 5 / B-20: mount each service's own SecretProviderClass — without a Pod actually
  # mounting it, the Secrets Store CSI driver never syncs anything into a real K8s Secret, and
  # the env vars added to base Deployment (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD via
  # secretKeyRef) would reference a Secret that doesn't exist → CreateContainerConfigError. Only
  # added here (not base/) because overlays/local has no CSI driver installed — its equivalent
  # Secret comes from Kustomize's secretGenerator instead (see overlays/local/kustomization.yaml).
  - target: { kind: Deployment, name: customer-service }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: customer-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
  - target: { kind: Deployment, name: product-catalog }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: product-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
  - target: { kind: Deployment, name: order-management }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: order-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
  - target: { kind: Deployment, name: billing-service }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: billing-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }

  # B-22: base hpa.yaml hardcodes minReplicas: 2 for every service. Dev's system node group is
  # only 2× t3.medium (~3.3 GiB allocatable each) — 2 HPA-mandated pods per backend + gateway +
  # both frontends adds up to 14 app pods before touching CoreDNS/kube-proxy/ALB Controller/CSI
  # driver pods already on those same 2 nodes, and the ENI-based pod limit on t3.medium is even
  # tighter than the memory budget. Match `replicas:` above (1) so HPA doesn't immediately try to
  # scale back up the moment `kubectl apply` finishes.
  - target: { kind: HorizontalPodAutoscaler, name: customer-service }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: product-catalog }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: order-management }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: billing-service }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: api-gateway }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: web-portal }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: admin-console }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }

  # B-23: base ingress.yaml turns on the HTTPS listener + ssl-redirect and expects a real
  # hostname + ACM certificate ARN. Dev has neither yet (no domain registered, ExternalDNS isn't
  # even installed for dev — see platform/README.md's phase labels) — asking the ALB Controller
  # for a cert it can't find means it silently never creates the ALB at all (no error anywhere
  # obvious to a first-time reader; `kubectl describe ingress` is the only place it shows up).
  # HTTP-only + no host restriction (path-based routing against the ALB's own generated DNS name)
  # until there's a real domain — see learning/20 Giai đoạn 5 checklist item 3.
  - target: { kind: Ingress, name: bss-ingress }
    patch: |-
      - op: remove
        path: /spec/rules/0/host
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1listen-ports
        value: '[{"HTTP":80}]'
      - op: remove
        path: /metadata/annotations/alb.ingress.kubernetes.io~1ssl-redirect
