apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bss

resources:
  - ../../base
  # Giai đoạn 6 (ADR-006): same 4 SecretProviderClass as overlays/dev, one per service's own
  # least-privilege RDS user (B-20, ADR-004) — this overlay had drifted (still on DB_URL literals,
  # no secrets, CHANGE_ME everywhere) which made `rc-vX` undeployable.
  - secrets

# Image tags: the `newTag: v0.0.0` values below are only placeholders. CD (ADR-005) never edits this
# file — it generates a throwaway kustomization (`scripts/release-manifest.sh render`, under
# infrastructure/kubernetes/rendered/, gitignored) that stacks `images:` with the real tag of every
# service on top of this overlay, matching by the FULL name set by `newName` below. The AWS account id
# (132249065347) is this project's real, stable account (see overlays/dev).
images:
  - name: customer-service
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/customer-service
    newTag: v0.0.0
  - name: product-catalog
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/product-catalog
    newTag: v0.0.0
  - name: order-management
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/order-management
    newTag: v0.0.0
  - name: billing-service
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/billing-service
    newTag: v0.0.0
  - name: api-gateway
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/api-gateway
    newTag: v0.0.0
  - name: web-portal
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/web-portal
    newTag: v0.0.0
  - name: admin-console
    newName: 132249065347.dkr.ecr.ap-southeast-1.amazonaws.com/bss/admin-console
    newTag: v0.0.0

configMapGenerator:
  # DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD come from each service's own SecretProviderClass
  # (overlays/prod/secrets/, ADR-004), not from literals here.
  - name: customer-service-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=INFO
      - AWS_REGION=ap-southeast-1
  - name: product-catalog-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=INFO
      - AWS_REGION=ap-southeast-1
  - name: order-management-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=INFO
      - AWS_REGION=ap-southeast-1
      - EVENT_BUS_NAME=bss-prod-events
  - name: billing-service-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=INFO
      - AWS_REGION=ap-southeast-1
      - SQS_QUEUE_URL=https://sqs.ap-southeast-1.amazonaws.com/132249065347/bss-prod-billing-orders
  - name: api-gateway-config
    literals:
      - SPRING_PROFILES_ACTIVE=aws
      - LOGGING_LEVEL_ROOT=INFO

replicas:
  - { name: customer-service, count: 3 }
  - { name: product-catalog, count: 3 }
  - { name: order-management, count: 3 }
  - { name: billing-service, count: 3 }
  - { name: api-gateway, count: 3 }
  - { name: web-portal, count: 3 }
  - { name: admin-console, count: 2 }

patches:
  # The CD deployer role only has a NAMESPACE-scoped EKS access policy on `bss` (B-34, least
  # privilege); a Namespace is cluster-scoped, so applying it as that role is Forbidden. It is
  # created once per cluster by `scripts/platform-install.sh` instead (see overlays/dev).
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bss

  # IRSA bindings — one IAM role per service ("bss-prod-<service>", environments/prod/main.tf `module "iam"`).
  - target: { kind: ServiceAccount, name: customer-service }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-prod-customer-service }
  - target: { kind: ServiceAccount, name: product-catalog }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-prod-product-catalog }
  - target: { kind: ServiceAccount, name: order-management }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-prod-order-management }
  - target: { kind: ServiceAccount, name: billing-service }
    patch: |-
      - op: add
        path: /metadata/annotations
        value: { eks.amazonaws.com/role-arn: arn:aws:iam::132249065347:role/bss-prod-billing-service }

  # Mount each service's own SecretProviderClass — without a Pod mounting it the Secrets Store CSI
  # driver never syncs the Kubernetes Secret the base Deployment's secretKeyRef expects.
  - target: { kind: Deployment, name: customer-service }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: customer-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
  - target: { kind: Deployment, name: product-catalog }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: product-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
  - target: { kind: Deployment, name: order-management }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: order-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
  - target: { kind: Deployment, name: billing-service }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: billing-db-credentials
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }

  # No domain/ACM certificate yet (deferred — see ADR-006 and overlays/dev B-23): base ingress.yaml
  # turns on HTTPS + ssl-redirect and a host, and an ALB Controller that can't find a certificate
  # silently never creates the ALB. HTTP-only, path-based routing against the ALB's own DNS name.
  - target: { kind: Ingress, name: bss-ingress }
    patch: |-
      - op: remove
        path: /spec/rules/0/host
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1listen-ports
        value: '[{"HTTP":80}]'
      - op: remove
        path: /metadata/annotations/alb.ingress.kubernetes.io~1ssl-redirect

  # Production hardening: tighter PDB minAvailable for backend.
  - target: { kind: PodDisruptionBudget, name: customer-service }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 2 }
  - target: { kind: PodDisruptionBudget, name: product-catalog }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 2 }
  - target: { kind: PodDisruptionBudget, name: order-management }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 2 }
  - target: { kind: PodDisruptionBudget, name: billing-service }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 2 }
  - target: { kind: PodDisruptionBudget, name: api-gateway }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 2 }

  # Bump backend resources for prod traffic.
  - target: { kind: Deployment, name: customer-service }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "500m" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: "768Mi" }
  - target: { kind: Deployment, name: product-catalog }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "500m" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: "768Mi" }
  - target: { kind: Deployment, name: order-management }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "500m" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: "768Mi" }
  - target: { kind: Deployment, name: billing-service }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "500m" }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: "768Mi" }
