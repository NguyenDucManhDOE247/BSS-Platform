# Mounts the RDS master secret + the 4 per-service secrets (Terraform-generated — see
# infrastructure/terraform/modules/rds/main.tf, B-21) into the db-bootstrap Job's pod, and syncs
# them into one K8s Secret ("db-bootstrap-credentials") the Job reads as plain env vars.
#
# This is the ONLY consumer of the master password in the whole cluster — every application
# service uses its OWN per-service secret instead (wired up in Giai đoạn 5, once each service's
# own SecretProviderClass + Deployment volume mount exist — see B-20).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-bootstrap-credentials
  namespace: bss
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "bss-prod/rds/master"
        objectType: "secretsmanager"
        jmesPath:
          - path: "host"
            objectAlias: "MASTER_HOST"
          - path: "username"
            objectAlias: "MASTER_USER"
          - path: "password"
            objectAlias: "MASTER_PASSWORD"
      - objectName: "bss-prod/rds/customer-service"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "CUSTOMER_USER"
          - path: "password"
            objectAlias: "CUSTOMER_PASSWORD"
          - path: "dbname"
            objectAlias: "CUSTOMER_DB"
      - objectName: "bss-prod/rds/product-catalog"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "PRODUCT_USER"
          - path: "password"
            objectAlias: "PRODUCT_PASSWORD"
          - path: "dbname"
            objectAlias: "PRODUCT_DB"
      - objectName: "bss-prod/rds/order-management"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "ORDERS_USER"
          - path: "password"
            objectAlias: "ORDERS_PASSWORD"
          - path: "dbname"
            objectAlias: "ORDERS_DB"
      - objectName: "bss-prod/rds/billing-service"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "BILLING_USER"
          - path: "password"
            objectAlias: "BILLING_PASSWORD"
          - path: "dbname"
            objectAlias: "BILLING_DB"
  secretObjects:
    - secretName: db-bootstrap-credentials
      type: Opaque
      data:
        - objectName: MASTER_HOST
          key: MASTER_HOST
        - objectName: MASTER_USER
          key: MASTER_USER
        - objectName: MASTER_PASSWORD
          key: MASTER_PASSWORD
        - objectName: CUSTOMER_USER
          key: CUSTOMER_USER
        - objectName: CUSTOMER_PASSWORD
          key: CUSTOMER_PASSWORD
        - objectName: CUSTOMER_DB
          key: CUSTOMER_DB
        - objectName: PRODUCT_USER
          key: PRODUCT_USER
        - objectName: PRODUCT_PASSWORD
          key: PRODUCT_PASSWORD
        - objectName: PRODUCT_DB
          key: PRODUCT_DB
        - objectName: ORDERS_USER
          key: ORDERS_USER
        - objectName: ORDERS_PASSWORD
          key: ORDERS_PASSWORD
        - objectName: ORDERS_DB
          key: ORDERS_DB
        - objectName: BILLING_USER
          key: BILLING_USER
        - objectName: BILLING_PASSWORD
          key: BILLING_PASSWORD
        - objectName: BILLING_DB
          key: BILLING_DB
