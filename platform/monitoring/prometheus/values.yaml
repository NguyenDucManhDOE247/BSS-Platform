# Values for prometheus-community/kube-prometheus-stack
#
# Install with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f monitoring/prometheus/values.yaml
#
# This bundle includes:
#   • Prometheus operator + Prometheus server
#   • Grafana with default Kubernetes dashboards
#   • Alertmanager
#   • node-exporter + kube-state-metrics

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "8GiB"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

    # Scrape pods that have prometheus.io/scrape=true annotations
    # (this is what the customer-service deployment sets).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

  ingress:
    enabled: false   # use kubectl port-forward locally; expose properly later

grafana:
  adminPassword: changeme   # rotate immediately; better: use secret + external secrets

  # Pre-load our custom BSS dashboards (mounted from a ConfigMap).
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: bss
          folder: BSS
          type: file
          options:
            path: /var/lib/grafana/dashboards/bss

  dashboardsConfigMaps:
    bss: bss-dashboards   # references the ConfigMap we apply separately

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

  config:
    route:
      group_by: ['alertname', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
    receivers:
      - name: 'default'
        # Hook this up to Slack / PagerDuty / email later.
        # See: https://prometheus.io/docs/alerting/latest/configuration/

# Use GKE's managed Prometheus where possible; we still run the operator for
# Grafana + Alertmanager, but disable the in-cluster Prometheus scraping of
# heavy node-level metrics that managed Prometheus already covers.
kube-state-metrics:
  enabled: true
nodeExporter:
  enabled: true
