# kube-prometheus-stack values, tuned for AWS EKS.
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f platform/monitoring/prometheus/values.yaml

prometheus:
  prometheusSpec:
    retention: 10d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  ingress:
    enabled: false

grafana:
  adminPassword: CHANGE_ME
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: bss
          folder: BSS
          type: file
          options:
            path: /var/lib/grafana/dashboards/bss
  dashboardsConfigMaps:
    bss: bss-dashboards

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  config:
    route:
      group_by: ["alertname", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
    receivers:
      - name: "default"
        # Wire to Slack / Discord / PagerDuty:
        # slack_configs:
        #   - api_url: https://hooks.slack.com/services/...
        #     channel: "#bss-alerts"

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false # EKS managed
    kubeScheduler: false         # EKS managed
    kubeProxy: false

kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true
