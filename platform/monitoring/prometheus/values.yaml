# kube-prometheus-stack values, tuned for AWS EKS.
# Install (Giai đoạn 7): ./scripts/monitoring-install.sh dev|staging|prod
#   Script này tạo Secret `grafana-admin` + `alertmanager-webhook` TRƯỚC khi chạy Helm, rồi cài chart
#   với file này + 1 file values tạm sinh ra (receiver Alertmanager, chứa đường dẫn tới Secret — không
#   chứa URL). Không còn `CHANGE_ME` nào phải sửa tay.

prometheus:
  prometheusSpec:
    retention: 10d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  ingress:
    enabled: false

grafana:
  # Mật khẩu KHÔNG nằm trong git (trước đây là `adminPassword: CHANGE_ME` — B-42): Grafana đọc từ Secret
  # do scripts/monitoring-install.sh tạo (sinh ngẫu nhiên lần đầu, giữ nguyên các lần sau).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: bss
          folder: BSS
          type: file
          options:
            path: /var/lib/grafana/dashboards/bss
  dashboardsConfigMaps:
    bss: bss-dashboards

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  config:
    route:
      group_by: ["alertname", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
    receivers:
      # B-42: kube-prometheus-stack luôn thêm 1 route mặc định cho alert "Watchdog" trỏ tới
      # receiver tên "null" (xem giải thích đầy đủ trong values-local.yaml, phát hiện được khi
      # cài thật lần đầu trên kind ở Giai đoạn 2) — thiếu receiver này, Alertmanager Operator báo
      # lỗi 'undefined receiver "null" used in route' và không bao giờ tạo StatefulSet.
      - name: "null"
      # Receiver "default" cố tình KHÔNG có integration nào ở đây: scripts/monitoring-install.sh thêm
      # discord/slack/webhook_configs (đọc URL từ FILE trong Secret `alertmanager-webhook`) qua một
      # file values tạm khi bạn đặt ALERT_WEBHOOK_URL — URL thật không bao giờ vào git hay `helm get values`.
      # Xem docs/runbooks/alerting-setup.md.
      - name: "default"

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false # EKS managed
    kubeScheduler: false         # EKS managed
    kubeProxy: false

kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true
