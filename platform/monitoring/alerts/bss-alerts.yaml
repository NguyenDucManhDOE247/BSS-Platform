apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bss-alerts
  namespace: monitoring
  labels:
    release: monitoring   # so kube-prometheus-stack picks it up
# Giai đoạn 7: mỗi alert trỏ tới runbook RIÊNG của nó (CLAUDE.md §10 — "Mọi alert có runbook_url").
# Trước đây cả 5 alert dùng chung 1 file (bss-high-error-rate.md) — người trực đêm bấm link vẫn
# phải tự đoán mình đang ở mục nào. Bộ quy tắc này có test đơn vị bằng promtool:
#   ./scripts/test-alert-rules.sh        (xem platform/monitoring/alerts/tests/)
spec:
  groups:
    - name: bss.platform.rules
      interval: 30s
      rules:
        # ---- Availability ---- #
        # Bắt "target còn trong danh sách nhưng scrape thất bại" (Pod chạy nhưng /actuator/prometheus
        # không trả lời, hoặc Pod chết mà Endpoints chưa kịp dọn). KHÔNG bắt được trường hợp service
        # bị scale về 0 / xóa: khi đó target biến mất khỏi Prometheus, series `up` cũng biến mất,
        # `up == 0` không có gì để so sánh → im lặng. Trường hợp đó do BssDeploymentUnavailable lo.
        - alert: BssServiceDown
          expr: |
            up{namespace="bss"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "Prometheus không scrape được {{ $labels.job }} ({{ $labels.pod }}) trong 2 phút."
            runbook_url: "https://github.com/NguyenDucManhDOE247/BSS-Platform/blob/main/docs/runbooks/bss-service-down.md"

        # Lỗ hổng của BssServiceDown được vá ở đây: nguồn sự thật là kube-state-metrics (đọc thẳng từ
        # API server: "Deployment này có bao nhiêu replica sẵn sàng?"), không phụ thuộc việc còn target
        # để scrape hay không. Đây là alert chứng minh checkpoint "tắt 1 service → alert ≤ 5 phút".
        - alert: BssDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="bss"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Deployment {{ $labels.deployment }} has 0 available replicas"
            description: "{{ $labels.deployment }} không có Pod nào sẵn sàng phục vụ trong 1 phút (scale về 0, ImagePullBackOff, readiness fail…)."
            runbook_url: "https://github.com/NguyenDucManhDOE247/BSS-Platform/blob/main/docs/runbooks/bss-service-down.md"

        # Còn chạy nhưng thiếu replica so với mong muốn (vd. 1/3 Pod Pending vì hết CPU node — chính là
        # sự cố thật ở buổi staging đầu tiên). Ngưỡng 10 phút để không kêu oan lúc rolling update / HPA
        # đang scale. `> 0` để không trùng với BssDeploymentUnavailable.
        - alert: BssDeploymentDegraded
          expr: |
            kube_deployment_status_replicas_available{namespace="bss"} > 0
            and on (namespace, deployment)
            kube_deployment_status_replicas_available{namespace="bss"}
              < on (namespace, deployment) kube_deployment_spec_replicas{namespace="bss"}
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Deployment {{ $labels.deployment }} thiếu replica"
            description: "{{ $labels.deployment }} có ít replica sẵn sàng hơn số mong muốn suốt 10 phút."
            runbook_url: "https://github.com/NguyenDucManhDOE247/BSS-Platform/blob/main/docs/runbooks/bss-service-down.md#3-thiếu-replica-bssdeploymentdegraded"

        # ---- Latency (Spring Boot via Micrometer) ---- #
        - alert: BssHighRequestLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le, application, uri) (
                rate(http_server_requests_seconds_bucket{namespace="bss"}[5m])
              )
            ) > 1.0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "p95 latency above 1s for {{ $labels.application }} {{ $labels.uri }}"
            description: "p95 latency has been > 1s for 10 minutes."
            runbook_url: "https://github.com/NguyenDucManhDOE247/BSS-Platform/blob/main/docs/runbooks/bss-high-latency.md"

        # ---- Error rate ---- #
        - alert: BssHighErrorRate
          expr: |
            sum by (application) (
              rate(http_server_requests_seconds_count{namespace="bss",status=~"5.."}[5m])
            )
            /
            sum by (application) (
              rate(http_server_requests_seconds_count{namespace="bss"}[5m])
            )
            > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "{{ $labels.application }} 5xx rate above 5%"
            runbook_url: "https://github.com/NguyenDucManhDOE247/BSS-Platform/blob/main/docs/runbooks/bss-high-error-rate.md"

        # ---- Pod restarts (CrashLoopBackoff canary) ---- #
        - alert: BssPodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="bss"}[15m]) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod {{ $labels.pod }} restarting repeatedly"
            runbook_url: "https://github.com/NguyenDucManhDOE247/BSS-Platform/blob/main/docs/runbooks/bss-pod-crash-looping.md"

        # ---- JVM heap pressure ---- #
        - alert: BssJvmHeapHigh
          expr: |
            sum by (pod) (jvm_memory_used_bytes{area="heap",namespace="bss"})
            /
            sum by (pod) (jvm_memory_max_bytes{area="heap",namespace="bss"})
            > 0.85
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "JVM heap > 85% on {{ $labels.pod }}"
            runbook_url: "https://github.com/NguyenDucManhDOE247/BSS-Platform/blob/main/docs/runbooks/bss-jvm-heap-high.md"
