# Helm values for Fluent Bit shipping pod logs to CloudWatch Logs.
# Log group naming matches the Terraform observability module output.
#
# Install:
#   helm repo add eks https://aws.github.io/eks-charts
#   helm upgrade --install fluent-bit eks/aws-for-fluent-bit -n amazon-cloudwatch \
#     -f platform/logging/fluent-bit-values.yaml \
#     --create-namespace \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::ACCOUNT_ID:role/bss-dev-fluent-bit

cloudWatchLogs:
  enabled: true
  region: ap-southeast-1
  autoCreateGroup: false # log groups already exist (created by Terraform)
  logGroupName: /aws/eks/CHANGE_ME_CLUSTER/application
  logStreamPrefix: "from-fluent-bit-"
  logRetentionDays: 7

input:
  tail:
    enabled: true
    path: /var/log/containers/*.log
    excludePath: /var/log/containers/*kube-system*.log,/var/log/containers/*amazon-cloudwatch*.log
    parser: docker

# Drop noisy debug logs in dev; keep everything in prod.
filter:
  kubernetes:
    enabled: true
    mergeLog: true
    keepLog: false # drop original "log" field after parsing

serviceAccount:
  create: true
  name: fluent-bit
  annotations: {} # set IRSA on install

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 200m
    memory: 250Mi

tolerations:
  - operator: Exists # run on every node, including taints

priorityClassName: system-node-critical
