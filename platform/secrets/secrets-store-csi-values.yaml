# Helm values for Secrets Store CSI Driver + AWS provider.
# Install (TWO charts):
#   helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
#   helm upgrade --install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver \
#     -n kube-system -f platform/secrets/secrets-store-csi-values.yaml
#
#   # Then install the AWS provider:
#   kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml

syncSecret:
  enabled: true # sync mounted secret into a K8s Secret too

enableSecretRotation: true
rotationPollInterval: 60s

linux:
  enabled: true
  crds:
    enabled: true
  driver:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
