# Helm values for Secrets Store CSI Driver + AWS provider.
# Install (TWO charts):
#   helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
#   helm upgrade --install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver \
#     -n kube-system -f platform/secrets/secrets-store-csi-values.yaml
#
#   # Then install the AWS provider:
#   kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml

# Giai đoạn 5: found for real applying to AWS — without this, every Pod mounting a
# SecretProviderClass gets "CSI token error: serviceAccount.tokens not provided - ensure
# tokenRequests is configured in CSIDriver". The AWS provider authenticates to Secrets Manager AS
# THE MOUNTING POD'S OWN IRSA role (that's the whole point — each service reads only its own
# secret, per B-20/ADR-004), which needs a projected ServiceAccount token scoped to the
# "sts.amazonaws.com" audience attached to the CSI volume mount. The driver doesn't request that
# token on its own; it has to be declared here so it lands on the CSIDriver object Kubernetes
# actually uses to know what to mount.
tokenRequests:
  - audience: sts.amazonaws.com

syncSecret:
  enabled: true # sync mounted secret into a K8s Secret too

enableSecretRotation: true
rotationPollInterval: 60s

linux:
  enabled: true
  crds:
    enabled: true
  driver:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
