# Giai đoạn 5 / B-20: this sample (pointing at the RDS *master* secret) has been replaced by 4
# real, per-service SecretProviderClass files that use each service's OWN least-privilege
# credential instead — see infrastructure/kubernetes/overlays/dev/secrets/. Kept here only as a
# pointer so anyone still linked to the old path finds the real thing; delete this file once
# nothing external references it anymore.
#
# Real files:
#   infrastructure/kubernetes/overlays/dev/secrets/customer-db-credentials-spc.yaml
#   infrastructure/kubernetes/overlays/dev/secrets/product-db-credentials-spc.yaml
#   infrastructure/kubernetes/overlays/dev/secrets/order-db-credentials-spc.yaml
#   infrastructure/kubernetes/overlays/dev/secrets/billing-db-credentials-spc.yaml
#
# Why they live under overlays/dev/ and not here (platform/, which is otherwise "cluster-wide,
# applied once"): the Secrets Manager secret NAME embeds the environment ("bss-dev/rds/..."), so
# each env (dev/staging/prod) needs its own copy with a different name_prefix — same reason
# overlays/dev/kustomization.yaml's IRSA role-arn patches are per-env, not in base/.
