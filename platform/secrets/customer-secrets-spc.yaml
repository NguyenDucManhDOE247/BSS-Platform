# Sample SecretProviderClass: mounts the RDS master secret from AWS Secrets Manager
# into customer-service's pod, and syncs it into a K8s Secret for envFrom use.
#
# Apply per-env (overlay the ARN). The IRSA role bound to the customer-service SA
# must have secretsmanager:GetSecretValue on this ARN.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: customer-db-credentials
  namespace: bss
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "bss-dev/rds/master"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "DB_USER"
          - path: "password"
            objectAlias: "DB_PASSWORD"
          - path: "host"
            objectAlias: "DB_HOST"
  secretObjects:
    - secretName: customer-db-credentials
      type: Opaque
      data:
        - objectName: DB_USER
          key: username
        - objectName: DB_PASSWORD
          key: password
        - objectName: DB_HOST
          key: host
