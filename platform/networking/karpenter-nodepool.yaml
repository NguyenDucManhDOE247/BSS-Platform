# Karpenter NodePool + EC2NodeClass for workload pods.
# System pods stay on the managed node group; everything else schedules here.
#
# Apply AFTER installing Karpenter via Helm. See platform/networking/README.md.
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: bss-dev-eks-node # match the Terraform-created node IAM role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: bss-dev-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: bss-dev-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
  tags:
    karpenter.sh/discovery: bss-dev-eks
    Project: bss-platform
    Environment: dev
    ManagedBy: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        role: workload
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"] # prefer spot
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h # recycle nodes weekly
  limits:
    cpu: 100
    memory: 200Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
