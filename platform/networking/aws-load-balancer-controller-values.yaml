# Helm values for aws-load-balancer-controller.
# Install:
#   helm repo add eks https://aws.github.io/eks-charts
#   helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system -f platform/networking/aws-load-balancer-controller-values.yaml \
#     --set clusterName=bss-dev-eks \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::ACCOUNT_ID:role/bss-dev-aws-lb-controller

clusterName: ""        # set on install
region: ap-southeast-1

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations: {}      # set IRSA role-arn on install

# Reduce log verbosity in dev; bump to 4+ in prod for debugging.
logLevel: info

# Pod settings
replicaCount: 2
podDisruptionBudget:
  maxUnavailable: 1

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    memory: 500Mi
