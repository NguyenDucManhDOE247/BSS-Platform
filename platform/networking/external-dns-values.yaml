# Helm values for ExternalDNS (B-23, ADR-012) — tạo bản ghi alias A trong Route 53 từ host của Ingress.
# Cài bằng scripts/platform-install.sh (bước 7), chart external-dns/external-dns 1.23.0 (app 0.23.0):
#   --set txtOwnerId=<cluster>            bản ghi TXT "sở hữu" — 3 cluster dùng chung 1 zone mà không giẫm nhau
#   --set domainFilters={<zone>}          chỉ đụng zone của dự án
#   --set serviceAccount.annotations…     IRSA role bss-<env>-external-dns (modules/platform-iam/external-dns.tf
#                                         — chỉ được ghi đúng host của môi trường đó)
#
# Bản cũ của file này (`provider: aws` + khối `aws:`) là cú pháp chart ≤ 1.13 — chart mới đã đổi `provider`
# thành object và bỏ khối `aws:` (vùng + loại zone đi qua env/args), nên file cũ chưa từng cài được thật.

provider:
  name: aws

env:
  - name: AWS_DEFAULT_REGION
    value: ap-southeast-1

extraArgs:
  - --aws-zone-type=public
  # TXT "sở hữu" = extdns-<kiểu>.<host> — PHẢI kết thúc bằng dấu chấm để nằm TRONG zone khi host là apex
  # (docs/registry/txt.md của ExternalDNS). Mặc định `a-<host>` với apex = `a-bssplatform.dpdns.org` → ngoài zone →
  # ExternalDNS lặng lẽ bỏ TXT, bản ghi A không chủ, không bao giờ được xóa (lỗi thật trên prod 2026-10-02).
  # Đổi giá trị này = đổi tên bản ghi được phép trong IAM (modules/platform-iam/external-dns.tf).
  - --txt-prefix=extdns-%{record_type}.

# sync = xóa luôn bản ghi khi Ingress bị xóa — teardown.sh xóa Ingress TRƯỚC destroy để ExternalDNS kịp dọn.
policy: sync
registry: txt
sources:
  - ingress # Service type LoadBalancer không dùng trong dự án
interval: 1m

txtOwnerId: "" # đặt lúc cài = tên cluster
domainFilters: [] # đặt lúc cài = zone

serviceAccount:
  create: true
  name: external-dns # khớp điều kiện `sub` của IRSA role
  annotations: {} # đặt lúc cài

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
