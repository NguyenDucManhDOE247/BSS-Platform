# OpenTelemetry Collector — receives OTLP traces from services, exports to AWS X-Ray.
# Install: ./scripts/tracing-install.sh dev|staging|prod (tự lấy role ARN từ Terraform output).
# Bản dùng cho kind (không cần AWS, exporter "debug" thay "awsxray"): otel-collector-values-local.yaml.
#
# ⚠️ Chưa kiểm chứng trên X-Ray thật (cần tài khoản AWS + tốn một khoản rất nhỏ, hỏi trước khi
# bật — CLAUDE.md §9). Điều CHƯA làm, ghi rõ để không tưởng nhầm là xong: X-Ray yêu cầu trace ID
# theo định dạng riêng của nó (8 ký tự đầu = Unix timestamp dạng hex) — OTel Java agent mặc định
# sinh trace ID ngẫu nhiên theo chuẩn W3C, KHÔNG khớp định dạng đó. Cần thêm
# `io.opentelemetry.contrib:opentelemetry-aws-xray` (autoconfigure customizer, đặt qua
# `OTEL_TRACES_SAMPLER`/`otel.javaagent.extensions` trỏ tới jar đó) để agent dùng
# `AwsXrayIdGenerator`. Việc đã làm (kiểm chứng thật trên kind, xem PR): trace THẬT chảy được từ
# app → agent → OTLP/HTTP → collector (dùng exporter `debug` ở bản local) — chỉ còn thiếu bước
# "định dạng ID cho đúng X-Ray" + IAM `xray:PutTraceSegments` khi nối AWS thật.

mode: deployment

# Cố định tên Service = "otel-collector" (khớp OTEL_EXPORTER_OTLP_ENDPOINT trong otel-config.yaml)
# bất kể tên bản Helm release — xem bug thật gặp khi kiểm chứng trên kind, comment đầy đủ ở
# otel-collector-values-local.yaml.
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1000
    memory_limiter:
      check_interval: 5s
      limit_mib: 400
      spike_limit_mib: 100

  exporters:
    awsxray:
      region: ap-southeast-1
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [awsxray]

serviceAccount:
  create: true
  name: otel-collector
  annotations: {} # IRSA on install

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    memory: 500Mi
