openapi: 3.1.0
info:
  title: BSS Product Order Management API
  description: |
    TM Forum TMF622 Product Order Management (subset).

    **Xác thực (Giai đoạn 9, ADR-008) khi `bss.auth.enabled=true`** — Bearer JWT Keycloak:
    - `POST` — chỉ role `customer`. `customerId` lấy từ hồ sơ của CHÍNH người đăng nhập
      (customer-service `GET /customer/me`, chuyển tiếp token); trường `customerId` trong body bị bỏ qua.
      Khách phải ở trạng thái `Active` (admin đã duyệt), nếu không → 422.
    - `GET` — role `customer` chỉ thấy đơn của mình (đơn người khác → 404); role `admin` thấy tất cả.
    Khi `bss.auth.enabled=false`: hành vi trước GĐ9 (`customerId` bắt buộc ở body và ở query list).
  version: 4.1.0

servers:
  - url: https://api.bss.example.com/api/tmf-api/orderManagement/v4

paths:
  /productOrder:
    post:
      summary: Create a product order
      description: Order is created in Acknowledged state; outbox emits OrderCompleted on commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductOrder' }
        '401': { description: Thiếu/sai token. }
        '403': { description: Không phải role customer. }
        '422': { description: Validation error / gói không bán / khách chưa có hồ sơ / khách chưa được duyệt. }
        '503': { description: product-catalog hoặc customer-service tạm thời không khả dụng. }
    get:
      summary: List orders (khách — của chính mình; admin — tất cả, lọc theo customerId)
      parameters:
        - in: query
          name: customerId
          description: Admin — lọc theo khách. Khách — bị bỏ qua. Auth tắt — bắt buộc.
          schema: { type: string, format: uuid }
        - { in: query, name: offset,     schema: { type: integer, default: 0 } }
        - { in: query, name: limit,      schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: A list of orders.
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductOrder' }

  /productOrder/{id}:
    get:
      summary: Get an order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: An order., content: { application/json: { schema: { $ref: '#/components/schemas/ProductOrder' } } } }
        '404': { description: Not found — hoặc đơn của người khác (khách không được biết id đó tồn tại). }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    OrderState:
      type: string
      enum: [Acknowledged, InProgress, Completed, Cancelled, Failed]

    # B-13 fix (Giai đoạn 1): this schema used to be shared by BOTH the create request and the
    # response, with productOfferingName/unitPrice required in both directions — meaning the
    # contract itself documented a client-supplied price. Split into CreateOrderItem (request:
    # only the offering id + quantity) and OrderItem (response: everything else, filled in by
    # order-management from product-catalog — see apps/backend/order-management's
    # ProductCatalogClient).
    CreateOrderItem:
      type: object
      required: [productOfferingId, quantity]
      properties:
        productOfferingId: { type: string, format: uuid }
        quantity:          { type: integer, minimum: 1 }

    OrderItem:
      type: object
      required: [id, productOfferingId, productOfferingName, quantity, unitPrice]
      properties:
        id:                   { type: string, format: uuid }
        productOfferingId:    { type: string, format: uuid }
        productOfferingName:  { type: string, description: "Filled in server-side from product-catalog, not client-supplied." }
        quantity:             { type: integer, minimum: 1 }
        unitPrice:            { type: number, format: float, description: "Filled in server-side from product-catalog's current price, not client-supplied." }

    ProductOrder:
      type: object
      required: [id, customerId, state, totalAmount, currency]
      properties:
        id:           { type: string, format: uuid }
        customerId:   { type: string, format: uuid }
        state:        { $ref: '#/components/schemas/OrderState' }
        category:     { type: string }
        description:  { type: string }
        totalAmount:  { type: number, format: float }
        currency:     { type: string, default: VND }
        completedAt:  { type: string, format: date-time }
        createdAt:    { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    CreateOrder:
      type: object
      required: [items]
      properties:
        customerId:
          type: string
          format: uuid
          deprecated: true
          description: Chỉ dùng khi auth tắt. Khi bật auth bị bỏ qua (lấy từ hồ sơ người đăng nhập). Xóa cùng công tắc bss.auth.enabled.
        category:    { type: string }
        description: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderItem' }
