openapi: 3.1.0
info:
  title: BSS Product Catalog Management API
  description: |
    TM Forum TMF620 Product Catalog Management (subset).

    **Xác thực (Giai đoạn 9, ADR-008) — luôn bật:**
    - `GET` — công khai (khách chưa đăng nhập vẫn duyệt gói). Người không phải admin **chỉ thấy gói
      đang bán** (`Active`, `Launched`): danh sách lọc bỏ gói khác (kể cả khi cố truyền
      `lifecycleStatus=Retired`), còn `GET /{id}` của gói đã ngừng bán → 404.
    - `POST`/`PATCH`/`DELETE` — Bearer JWT role `admin`.
  version: 4.1.0

servers:
  - url: https://api.bss.example.com/api/tmf-api/productCatalog/v4

paths:
  /productOffering:
    get:
      summary: List product offerings
      parameters:
        - { in: query, name: categoryId,      schema: { type: string, format: uuid } }
        - { in: query, name: lifecycleStatus, schema: { $ref: '#/components/schemas/LifecycleStatus' } }
        - { in: query, name: offset,          schema: { type: integer, default: 0 } }
        - { in: query, name: limit,           schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: A list of product offerings.
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductOffering' }
    post:
      summary: Create a product offering (admin)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOffering' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductOffering' }

  /productOffering/{id}:
    get:
      summary: Get a product offering
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: A product offering., content: { application/json: { schema: { $ref: '#/components/schemas/ProductOffering' } } } }
        '404': { description: Not found — hoặc gói không còn bán và người gọi không phải admin. }
    patch:
      summary: Sửa gói (giá, mô tả) / ngừng bán (`lifecycleStatus=Retired`) — admin
      description: |
        Merge-patch (RFC 7396): trường không gửi = giữ nguyên, `null` = xóa (xem PatchOffering). Đổi giá KHÔNG ảnh hưởng đơn hàng cũ — order-management
        lưu giá tại thời điểm mua (B-13). "Ngừng bán" nên dùng PATCH thay vì DELETE để giữ lịch sử.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/PatchOffering' }
      responses:
        '200': { description: Updated., content: { application/json: { schema: { $ref: '#/components/schemas/ProductOffering' } } } }
        '401': { description: Thiếu/sai token. }
        '403': { description: Không phải admin. }
        '404': { description: Not found. }
        '422': { description: 'Dữ liệu không hợp lệ (vd. giá âm), hoặc trường bắt buộc gửi null.' }
    delete:
      summary: Delete a product offering (admin)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '404': { description: Not found. }

  /category:
    get:
      summary: List categories
      responses:
        '200':
          description: A list of categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /category/{id}:
    get:
      summary: Get a category
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: A category., content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '404': { description: Not found. }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    PatchOffering:
      type: object
      description: |
        JSON Merge Patch (RFC 7396, B-15): không gửi trường = giữ nguyên; `null` = XÓA (chỉ `description`,
        `validForStart`, `validForEnd`); `name`/`priceAmount`/`lifecycleStatus` bắt buộc → `null` = 422.
      properties:
        name:              { type: string, minLength: 1 }
        description:       { type: [string, 'null'] }
        priceAmount:       { type: number, minimum: 0 }
        lifecycleStatus:   { $ref: '#/components/schemas/LifecycleStatus' }
        validForStart:     { type: [string, 'null'], format: date-time }
        validForEnd:       { type: [string, 'null'], format: date-time }

    LifecycleStatus:
      type: string
      enum: [InStudy, InDesign, InTest, Active, Launched, Retired, Obsolete]

    Category:
      type: object
      required: [id, name]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        parentId:    { type: string, format: uuid }

    ProductOffering:
      type: object
      required: [id, name, priceAmount, priceCurrency, lifecycleStatus]
      properties:
        id:                { type: string, format: uuid }
        name:              { type: string }
        description:       { type: string }
        categoryId:        { type: string, format: uuid }
        specificationId:   { type: string, format: uuid }
        lifecycleStatus:   { $ref: '#/components/schemas/LifecycleStatus' }
        bundle:            { type: boolean, default: false }
        priceAmount:       { type: number, format: float }
        priceCurrency:     { type: string, default: VND }
        recurringPeriod:   { type: string, enum: [monthly, yearly, one_time] }
        validForStart:     { type: string, format: date-time }
        validForEnd:       { type: string, format: date-time }

    CreateOffering:
      type: object
      required: [name, priceAmount]
      properties:
        name:              { type: string, minLength: 1 }
        description:       { type: string }
        categoryId:        { type: string, format: uuid }
        specificationId:   { type: string, format: uuid }
        priceAmount:       { type: number, format: float, minimum: 0 }
        priceCurrency:     { type: string, default: VND }
        recurringPeriod:   { type: string, enum: [monthly, yearly, one_time], default: monthly }
        bundle:            { type: boolean }
        validForStart:     { type: string, format: date-time }
        validForEnd:       { type: string, format: date-time }
