openapi: 3.1.0
info:
  title: BSS Product Catalog Management API
  description: TM Forum TMF620 Product Catalog Management (subset)
  version: 4.0.0

servers:
  - url: https://api.bss.example.com/api/tmf-api/productCatalog/v4

paths:
  /productOffering:
    get:
      summary: List product offerings
      parameters:
        - { in: query, name: categoryId,      schema: { type: string, format: uuid } }
        - { in: query, name: lifecycleStatus, schema: { $ref: '#/components/schemas/LifecycleStatus' } }
        - { in: query, name: offset,          schema: { type: integer, default: 0 } }
        - { in: query, name: limit,           schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: A list of product offerings.
          headers:
            X-Total-Count: { schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductOffering' }
    post:
      summary: Create a product offering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOffering' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductOffering' }

  /productOffering/{id}:
    get:
      summary: Get a product offering
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: A product offering., content: { application/json: { schema: { $ref: '#/components/schemas/ProductOffering' } } } }
        '404': { description: Not found. }
    delete:
      summary: Delete a product offering
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '404': { description: Not found. }

  /category:
    get:
      summary: List categories
      responses:
        '200':
          description: A list of categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /category/{id}:
    get:
      summary: Get a category
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: A category., content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '404': { description: Not found. }

components:
  schemas:
    LifecycleStatus:
      type: string
      enum: [InStudy, InDesign, InTest, Active, Launched, Retired, Obsolete]

    Category:
      type: object
      required: [id, name]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        parentId:    { type: string, format: uuid }

    ProductOffering:
      type: object
      required: [id, name, priceAmount, priceCurrency, lifecycleStatus]
      properties:
        id:                { type: string, format: uuid }
        name:              { type: string }
        description:       { type: string }
        categoryId:        { type: string, format: uuid }
        specificationId:   { type: string, format: uuid }
        lifecycleStatus:   { $ref: '#/components/schemas/LifecycleStatus' }
        bundle:            { type: boolean, default: false }
        priceAmount:       { type: number, format: float }
        priceCurrency:     { type: string, default: VND }
        recurringPeriod:   { type: string, enum: [monthly, yearly, one_time] }
        validForStart:     { type: string, format: date-time }
        validForEnd:       { type: string, format: date-time }

    CreateOffering:
      type: object
      required: [name, priceAmount]
      properties:
        name:              { type: string, minLength: 1 }
        description:       { type: string }
        categoryId:        { type: string, format: uuid }
        specificationId:   { type: string, format: uuid }
        priceAmount:       { type: number, format: float, minimum: 0 }
        priceCurrency:     { type: string, default: VND }
        recurringPeriod:   { type: string, enum: [monthly, yearly, one_time], default: monthly }
        bundle:            { type: boolean }
        validForStart:     { type: string, format: date-time }
        validForEnd:       { type: string, format: date-time }
