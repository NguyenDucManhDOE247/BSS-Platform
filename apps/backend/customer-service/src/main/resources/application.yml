spring:
  application:
    name: customer-service
  jackson:
    deserialization:
      # B-15: Spring Boot's own default is `false` (silently drop unrecognized JSON fields).
      # A caller sending a field not in the target DTO — e.g. trying to set the server-owned
      # `status` on customer creation — got a 201 with no signal that the field was dropped.
      # No other DTO in this service currently depends on lenient parsing (checked every test).
      fail-on-unknown-properties: true
  datasource:
    # Giai đoạn 5 / B-20: composed from 3 vars instead of 1 literal DB_URL, so the RDS hostname
    # never has to be hand-copied into a K8s manifest — on AWS, DB_HOST/DB_PORT come straight out
    # of the per-service Secrets Manager entry (via SecretProviderClass, same secretKeyRef as
    # DB_USER/DB_PASSWORD below); locally, defaults already point at localhost:5432/customer.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer}
    username: ${DB_USER:bss}
    password: ${DB_PASSWORD:bss}
    # NGÂN SÁCH KẾT NỐI (đo thật 2026-10-01, dev EKS 200→700 req/s): HikariCP mặc định giữ SẴN 10 kết nối/Pod
    # (minimum-idle = maximum-pool-size = 10) dù không dùng. HPA đẩy product-catalog lên 8 Pod = 80 kết nối,
    # trong khi db.t3.micro chỉ cho ~70 kết nối thường cho CẢ 5 database → Pod mới chết lúc khởi động
    # ("remaining connection slots are reserved"), Pod cũ trả 500 ("Cannot acquire connection") — 1.447/79.364
    # request. Đo lúc đó: total=10/10, idle=10, active=0 — kết nối bị GIỮ chứ không phải DB chậm.
    # Quy tắc: Σ (maxReplicas × maximum-pool-size) của mọi service dùng chung instance ≤ max_connections − dự trữ.
    # 5 kết nối dư cho 1 Pod (truy vấn vài ms); idle tối thiểu 1 → Pod rảnh chỉ giữ 1.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  jpa:
    # Tắt Open Session In View (Boot bật mặc định). Bật thì MỖI request giữ 1 kết nối DB suốt đường đi, kể cả
    # lúc chuyển kết quả thành JSON — đo thật 2026-10-01: Pod gánh tải đầu tiên với pool 5 phải CHỜ kết nối
    # trung bình 874ms/lần khi CPU bão hòa (serialize chậm → kết nối bị giữ lâu). Tắt thì kết nối trả về ngay
    # sau truy vấn; điều kiện: service map entity → DTO BÊN TRONG @Transactional (đã đúng ở cả 4 service — IT
    # sẽ báo LazyInitializationException nếu có chỗ nào sai).
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema owned by Flyway
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful # important for K8s rolling updates

# Expose health probes and Prometheus scrape endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    # B-16: without this, Micrometer never emits http_server_requests_seconds_bucket, so any
    # Grafana panel or alert built on histogram_quantile(...) (p95/p99 latency) reads empty —
    # it needs the _bucket series, not just _sum/_count.
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    # JSON-friendly format; switch to LogstashEncoder once you add a shipping stack.
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
