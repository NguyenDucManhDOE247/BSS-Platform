spring:
  application:
    name: product-catalog
  datasource:
    # Giai đoạn 5 / B-20 — see the identical comment in customer-service/application.yml.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product}
    username: ${DB_USER:bss}
    password: ${DB_PASSWORD:bss}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  # B-16: customer-service was the only one of the 4 with this tag + histogram — dashboards
  # that filter/group `by (application)` couldn't distinguish the other 3 services, and no
  # service exported the _bucket series a p95/p99 latency panel needs.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  prometheus:
    metrics:
      export:
        enabled: true
