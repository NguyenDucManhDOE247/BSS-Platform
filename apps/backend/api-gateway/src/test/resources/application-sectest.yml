# Chỉ dùng bởi SecurityConfigTest (@ActiveProfiles("sectest")). Nhân bản đúng cấu trúc route của
# application.yml nhưng trỏ URI vào cổng loopback không ai nghe (bị từ chối NGAY — RST, không
# phải đợi DNS hết hạn) — test chỉ cần biết "security có cho request lọt qua hay không", downstream
# thật sự trả lời gì không phải việc của test này. Ghi đè NGUYÊN cả list `routes` (không ghi đè
# từng phần tử qua property) vì Spring không merge được property rời rạc vào 1 phần tử YAML list
# đã tồn tại — đã tự kiểm chứng: `spring.cloud.gateway.routes[0].uri=...` làm context load LỖI
# (property binder đòi đủ field bắt buộc của route, không chỉ uri).
#
# Giai đoạn 9: "bị từ chối NGAY" đúng trên Linux (CI), nhưng trong WSL2 cổng 1 đóng KHÔNG trả RST mà
# treo tới khi hết giờ → WebTestClient báo "Timeout on blocking read" sau 5s, test đỏ oan dù security
# đúng. Timeout ngắn dưới đây làm downstream hỏng NHANH (5xx) ở mọi máy — test chỉ quan tâm "có bị
# 401/403 hay không".
spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 300   # ms
        response-timeout: 1s
      routes:
        - id: customer
          uri: http://127.0.0.1:1
          predicates:
            - Path=/api/tmf-api/customerManagement/**
        - id: product
          uri: http://127.0.0.1:1
          predicates:
            - Path=/api/tmf-api/productCatalog/**
        - id: order
          uri: http://127.0.0.1:1
          predicates:
            - Path=/api/tmf-api/orderManagement/**
        - id: billing
          uri: http://127.0.0.1:1
          predicates:
            - Path=/api/tmf-api/billingManagement/**
      default-filters:
        - StripPrefix=1
