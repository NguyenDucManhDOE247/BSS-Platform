spring:
  application:
    name: order-management
  datasource:
    # Giai đoạn 5 / B-20 — see the identical comment in customer-service/application.yml.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:bss}
    password: ${DB_PASSWORD:bss}
    # Ngân sách kết nối RDS — lý do + số đo ở customer-service/application.yml (2026-10-01).
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  jpa:
    open-in-view: false # lý do + số đo ở customer-service/application.yml (2026-10-01)
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

aws:
  region: ${AWS_REGION:ap-southeast-1}
  endpoint-url: ${AWS_ENDPOINT_URL:} # set to http://localhost:4566 for LocalStack
  eventbridge:
    bus-name: ${EVENT_BUS_NAME:bss-dev-events}

# B-13: order-management's own source of truth for price is product-catalog, called over
# REST. K8s-style default (Service DNS); overridden per environment/profile — see
# application-local.yml for the laptop-dev override to a plain localhost port.
bss:
  clients:
    product-catalog:
      base-url: ${PRODUCT_CATALOG_URL:http://product-catalog.bss.svc.cluster.local}
    # Giai đoạn 9 (ADR-008): GET /customer/me bằng token của chính khách — xem CustomerClient.
    # Cần NetworkPolicy allow-order-to-dependencies (base) để đi qua được trên CNI có enforce.
    customer-service:
      base-url: ${CUSTOMER_SERVICE_URL:http://customer-service.bss.svc.cluster.local}
  # B-14: lets tests turn the @Scheduled outbox drainer off instead of it NPE-ing every 2s
  # against a @MockBean EventBridgeClient that returns null.
  outbox:
    publisher:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      productCatalog:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.bss.order.client.UnknownOfferingException
      # Giai đoạn 9: "chưa có hồ sơ" (404) là lỗi NGƯỜI DÙNG, không phải customer-service hỏng —
      # không được tính vào circuit breaker (nếu tính, vài khách chưa hoàn tất hồ sơ bấm mua là đủ
      # làm mở mạch, chặn luôn khách hợp lệ).
      customerService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.bss.order.client.NoCustomerProfileException
  retry:
    instances:
      customerService:
        max-attempts: 3
        wait-duration: 200ms
        ignore-exceptions:
          - com.bss.order.client.NoCustomerProfileException
      productCatalog:
        max-attempts: 3
        wait-duration: 200ms
        # A 404 (offering genuinely doesn't exist) is a client error, not a transient fault —
        # retrying/circuit-breaking on it would be pointless and would mask the real 422.
        ignore-exceptions:
          - com.bss.order.client.UnknownOfferingException

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  # B-16: see the identical note in customer-service/application.yml.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  prometheus:
    metrics:
      export:
        enabled: true
