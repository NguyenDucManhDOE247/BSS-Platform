# B-02 fix — see customer-service/application-local.yml for the full explanation.
# Port map: api-gateway 8080, customer-service 8081, product-catalog 8082,
# order-management 8083 (this service), billing-service 8084.
server:
  port: 8083

# B-13: on a laptop there is no "product-catalog.bss.svc.cluster.local" DNS name — that only
# resolves inside the K8s cluster. Point straight at product-catalog's local port instead.
bss:
  clients:
    product-catalog:
      base-url: http://localhost:8082
    customer-service: # Giai đoạn 9 — GET /customer/me (xem CustomerClient)
      base-url: http://localhost:8081

logging:
  level:
    com.bss: DEBUG

# Auth luôn bật (ADR-008 QĐ 6): token do Keycloak của docker-compose phát (KC_HOSTNAME =
# http://localhost:8180/auth → `iss` khớp đúng chuỗi dưới đây; JWKS tải cùng địa chỉ vì service chạy
# bằng `mvn` trên chính máy đó — khác kind, nơi phải tách iss công khai / JWKS nội bộ).
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/auth/realms/bss}
