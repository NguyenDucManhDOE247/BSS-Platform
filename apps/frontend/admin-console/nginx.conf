server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # B-06 (tiếp — phần Ingress/nginx, PR #53 mới chỉ sửa nửa phía Vite/HTML): cả ALB Ingress lẫn
  # ingress-nginx đều KHÔNG cắt tiền tố "/admin" trước khi chuyển tiếp request tới Pod này — trình
  # duyệt gọi thẳng "/admin/assets/index-*.js" (đúng theo `base: '/admin/'` trong vite.config.ts)
  # và nguyên request đó (còn cả tiền tố) mới tới Pod. Vì vậy file build PHẢI thực sự nằm dưới thư
  # mục con "admin/" bên trong container (xem Dockerfile COPY), không phải ở gốc — nếu không,
  # đúng những gì đã xảy ra: HTML tải được (nhờ SPA fallback bên dưới "vô tình" khớp), nhưng mọi
  # file .js/.css đều 404 vì chúng thực sự không nằm ở "/admin/assets/..." trên đĩa.
  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location ~* ^/admin/.*\.(js|css|woff2|svg|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # K8s startup/liveness/readiness probe gọi thẳng Pod ở gốc "/healthz" (containerPort 8080,
  # không qua Ingress) — không có tiền tố "/admin", giữ độc lập với 3 location bên trên.
  location = /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
