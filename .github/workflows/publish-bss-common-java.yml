name: Publish — bss-common-java

# Giai đoạn 3, mục 6 (tùy chọn): packages/bss-common-java từng tồn tại nhưng KHÔNG service nào
# dùng — mỗi service tự chép NotFoundException/GlobalExceptionHandler của riêng mình (B-15).
# Publish lên GitHub Packages là bước để service THẬT SỰ khai báo nó như 1 dependency Maven
# bình thường (`<dependency>` + `<repository>`), thay vì "copy code qua lại giữa thư mục".
#
# Chỉ chạy khi merge vào main (không chạy trên PR — PR không có quyền `packages: write`, và
# GitHub Packages không cho ghi đè 1 version đã tồn tại nên publish thử trên mỗi PR sẽ hỏng
# ngay từ lần merge thứ 2 nếu quên bump version).
on:
  push:
    branches: [main]
    paths:
      - 'packages/bss-common-java/**'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `server-id: github` makes setup-java write ~/.m2/settings.xml with a <server> block for
      # id "github", credentials taken from the GITHUB_TOKEN/GITHUB_ACTOR env vars below — this
      # is what lets `mvn deploy` authenticate to GitHub Packages without a hand-written
      # settings.xml (and without ever putting a token in a committed file).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Deploy to GitHub Packages
        working-directory: packages/bss-common-java
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
