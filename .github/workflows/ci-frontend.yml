name: CI — frontend

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'packages/ui-kit/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/ui-kit/**'

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web-portal:    'apps/frontend/web-portal/**'
            admin-console: 'apps/frontend/admin-console/**'

  build-and-test:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: apps/frontend/${{ matrix.app }}
        # B-04 fix: `npm ci || npm install` silently fell back to a non-reproducible install
        # whenever `npm ci` failed for any reason (including a real lockfile drift bug) — the
        # step always exited 0 either way. Both apps now commit `package-lock.json`, so `npm ci`
        # (exact, reproducible, and fails loudly on drift) is the only install this needs.
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: apps/frontend/${{ matrix.app }}
        run: npm run lint --if-present

      - name: Test
        working-directory: apps/frontend/${{ matrix.app }}
        run: npm test --if-present

      - name: Build
        working-directory: apps/frontend/${{ matrix.app }}
        run: npm run build

      - name: Docker build (no push)
        working-directory: apps/frontend/${{ matrix.app }}
        run: docker build -t ${{ matrix.app }}:ci .

      - name: Trivy scan
        # B-54: see the identical comment in ci-backend.yml — tag "0.20.0" no longer resolves.
        # Giai đoạn 5: same missing-`trivyignores` bug found in ci-backend.yml applies here too —
        # see that file's comment for the full explanation.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: apps/frontend/${{ matrix.app }}/.trivyignore
