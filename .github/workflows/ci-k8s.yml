name: CI — kubernetes manifests

on:
  pull_request:
    paths:
      - 'infrastructure/kubernetes/**'
      - 'platform/**'
      - 'scripts/test-alert-rules.sh'
      - '.github/workflows/ci-k8s.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.30.0

      # Dọn nợ GĐ3 — CI flaky: `install_kustomize.sh` gọi GitHub API KHÔNG xác thực để tra release →
      # thỉnh thoảng "Github rate-limiter failed the request" (đỏ oan ở PR #170, #175; chạy lại thì xanh).
      # Tải thẳng asset của release đã ghim (không qua API) + kiểm SHA-256 (lấy từ checksums.txt chính thức
      # của v5.8.1) — vừa hết flaky, vừa chặn được file bị tráo.
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
          KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        run: |
          curl -fsSL --retry 3 -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install kube-linter
        run: |
          curl -sL https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz | tar xz
          sudo mv kube-linter /usr/local/bin/

      - name: Build and validate each overlay
        # `local` added alongside dev/staging/prod: it's a real 4th Kustomize overlay (Giai đoạn
        # 2, PR #51 — Postgres/LocalStack/secretGenerator for the kind cluster), and nothing
        # here had been checking it — a break in `overlays/local` would only ever surface the
        # next time someone tried to actually run kind locally, not in CI.
        run: |
          for env in dev staging prod local; do
            echo "── overlay: $env ──"
            kustomize build infrastructure/kubernetes/overlays/$env | \
              kubeconform -strict -ignore-missing-schemas -summary -
          done

      - name: kube-linter (advisory — does not fail the build yet)
        # Kept non-blocking on purpose: kube-linter's default checks (e.g. "no anti-affinity",
        # "no read-only root filesystem" on sidecars it doesn't recognize) haven't been triaged
        # against this repo's manifests yet. Flip to a real failure once a `.kube-linter.yaml`
        # exists with the checks this project actually wants enforced.
        run: |
          for env in dev staging prod local; do
            echo "── kube-linter: $env ──"
            kustomize build infrastructure/kubernetes/overlays/$env > /tmp/manifests-$env.yaml
            kube-linter lint /tmp/manifests-$env.yaml || true
          done

  # Giai đoạn 7: alert cũng là code — test đơn vị bằng promtool (không cần cluster). Job này bắt các lỗi
  # kiểu "sửa PromQL làm alert không bao giờ bắn" ngay ở PR thay vì lúc 3 giờ sáng.
  alert-rules:
    name: promtool — test alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # yq + docker đều có sẵn trên ubuntu-latest; promtool chạy trong image prom/prometheus (ghim version trong script).
      - name: promtool test rules
        run: ./scripts/test-alert-rules.sh
