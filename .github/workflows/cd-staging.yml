name: CD — staging

# Tag `rc-vX.Y.Z` (đặt trên một commit của main) → promote lên staging. Thiết kế: ADR-005 (promotion) +
# ADR-006 (staging là cluster riêng, dựng theo buổi).
#
# "Promote" KHÔNG build lại và KHÔNG pull/push layer nào:
#   1. tính lại desired TẠI COMMIT CỦA TAG (mỗi service = commit cuối chạm thư mục của nó — cả 8 image
#      luôn có image, không còn "service không có image ở SHA này" — B-51);
#   2. `aws ecr put-image` gắn thêm tag `rc-vX.Y.Z` lên đúng manifest digest của 8 image đó;
#   3. deploy manifest 8 image lên bss-staging-eks; smoke PASS → ghi staging.json + releases/rc-vX.Y.Z.json
#      (`verified_in: [staging]` — cổng để cd-prod chấp nhận).
#
# Chạy lại / dựng lại cluster staging: Actions → CD — staging → Run workflow, chọn "Tag: rc-vX.Y.Z" làm
# ref (cùng code path như push tag, deterministic).
#
# Job deploy chạy trên runner CodeBuild TRONG VPC staging (ADR-013, docs/runbooks/cd-runner.md).
#
# Cần: GitHub Environment `staging` (variable AWS_ROLE_ARN = role bss-github-deployer-staging; deployment
# tag policy `rc-v*`), repository variable ECR_REGISTRY + AWS_PREFLIGHT_ROLE_ARN — xem docs/SETUP.md Part 6.

on:
  push:
    tags:
      - 'rc-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER: bss-staging-eks
  CD_RUNNER: bss-staging-gha-runner # project CodeBuild (modules/ci-runner) — cùng tên trong `runs-on` bên dưới
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  # Job deploy chạy trên runner CodeBuild TRONG VPC của staging (ADR-013) để gọi API server qua endpoint private —
  # endpoint public của EKS không còn phải mở cho runner của GitHub. Môi trường là ephemeral: chưa dựng thì project
  # runner không tồn tại và job deploy sẽ nằm chờ runner vô thời hạn. Job này (runner của GitHub, role chỉ-đọc
  # bss-github-cd-preflight) báo lỗi rõ ràng TRƯỚC khi điều đó xảy ra.
  runner:
    name: Cluster + runner trong VPC đã sẵn sàng?
    if: startsWith(github.ref, 'refs/tags/rc-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PREFLIGHT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Kiểm tra
        run: |
          if ! status="$(aws eks describe-cluster --name "$EKS_CLUSTER" --query cluster.status --output text 2>&1)"; then
            if grep -q ResourceNotFoundException <<<"$status"; then
              echo "::error::Cluster $EKS_CLUSTER chưa được dựng (staging là ephemeral — ADR-006). Dựng theo docs/runbooks/cd-staging-prod-demo.md rồi chạy lại workflow này trên chính tag ${GITHUB_REF_NAME}."
            else
              echo "::error::Không hỏi được trạng thái $EKS_CLUSTER: $status"
            fi
            exit 1
          fi
          [ "$status" = ACTIVE ] || { echo "::error::Cluster $EKS_CLUSTER đang $status — chờ ACTIVE rồi chạy lại."; exit 1; }
          found="$(aws codebuild batch-get-projects --names "$CD_RUNNER" --query 'projects[0].name' --output text)"
          [ "$found" = "$CD_RUNNER" ] || { echo "::error::Chưa có project CodeBuild $CD_RUNNER (runner CD trong VPC). State shared đã có kết nối GitHub AVAILABLE chưa? — docs/runbooks/cd-runner.md"; exit 1; }
          echo "✓ $EKS_CLUSTER ACTIVE, runner $CD_RUNNER sẵn sàng"

  promote-and-deploy:
    name: Promote ${{ github.ref_name }} → staging
    needs: runner
    # `runs-on` không đọc được context `env` → tên project lặp lại ở đây (phải khớp env.CD_RUNNER).
    runs-on: codebuild-bss-staging-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: write # ghi manifest lên nhánh deploy-state
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # desired cần đủ lịch sử; cũng để có origin/main cho bước kiểm tra bên dưới

      # Một tag rc gắn nhầm vào commit của nhánh feature sẽ đẩy code CHƯA qua review/CI lên staging.
      - name: Tag phải trỏ vào một commit của main
        run: scripts/release-manifest.sh on-main "$GITHUB_SHA"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Image CodeBuild có sẵn git/jq/aws/curl nhưng kubectl của nó cũ hơn cluster nhiều bản — cài đúng bản
      # (kustomize đi kèm trong kubectl). Kiểm sha256 vì đây là binary sẽ cầm quyền deploy.
      - name: kubectl đúng bản cluster
        env:
          KUBECTL_VERSION: v1.34.11
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Release manifest = desired tại commit của tag
        id: manifests
        run: |
          scripts/release-manifest.sh new staging "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_REF" \
            > "$RUNNER_TEMP/release.json"
          scripts/release-manifest.sh set-field "$RUNNER_TEMP/release.json" release "$GITHUB_REF_NAME"
          scripts/release-manifest.sh validate "$RUNNER_TEMP/release.json"

          missing="$(scripts/release-manifest.sh ecr-missing "$RUNNER_TEMP/release.json")"
          if [ "$missing" != "[]" ]; then
            echo "::error::Chưa có image trong ECR cho: $missing tại commit $GITHUB_SHA. cd-dev chưa build xong / đã lỗi cho commit đó? Tag rc chỉ nên đặt sau khi CD dev của commit ấy xanh."
            exit 1
          fi

          # last-known-good của staging (exit 3 = chưa có; mã khác là lỗi thật)
          # `previous`: last-known-good, hoặc RỖNG nếu chưa có / manifest cũ trước ADR-011 (thiếu keycloak).
          previous="$(scripts/release-manifest.sh previous staging.json "$RUNNER_TEMP/previous.json")"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          [ -n "$previous" ] || echo "::notice::Không có last-known-good dùng được cho staging (lần deploy đầu, hoặc manifest cũ trước ADR-011) — lần này không thể rollback."
          echo "Thay đổi so với staging hiện tại:"
          scripts/release-manifest.sh diff "$RUNNER_TEMP/previous.json" "$RUNNER_TEMP/release.json" || true

      # Bằng `aws ecr put-image` — không docker pull/tag/push. Chạy lại vô hại (cùng digest → bỏ qua);
      # tag đã trỏ image KHÁC thì dừng (ECR tag IMMUTABLE).
      - name: Gắn tag ${{ github.ref_name }} lên 8 image (aws ecr put-image)
        run: scripts/release-manifest.sh ecr-tag "$RUNNER_TEMP/release.json" "$GITHUB_REF_NAME"

      - name: Deploy staging + smoke + rollback nếu hỏng
        uses: ./.github/actions/deploy-release
        with:
          environment: staging
          cluster: ${{ env.EKS_CLUSTER }}
          registry: ${{ env.ECR_REGISTRY }}
          manifest: ${{ runner.temp }}/release.json
          previous-manifest: ${{ steps.manifests.outputs.previous }}
          region: ${{ env.AWS_REGION }}

      # Chỉ tới được đây khi mọi thứ PASS. `verified_in: [staging]` là cổng của cd-prod.
      - name: Ghi manifest (staging.json + releases/${{ github.ref_name }}.json)
        run: |
          scripts/release-manifest.sh add-verified "$RUNNER_TEMP/release.json" staging
          scripts/release-manifest.sh state-put "release($GITHUB_REF_NAME): staging OK" \
            "staging.json=$RUNNER_TEMP/release.json" \
            "releases/$GITHUB_REF_NAME.json=$RUNNER_TEMP/release.json"

      - name: Tóm tắt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### CD staging — $JOB_STATUS"
            echo ""
            echo "Release \`$GITHUB_REF_NAME\` (commit \`${GITHUB_SHA::7}\`) → cluster \`$EKS_CLUSTER\`"
            echo ""
            echo '| Service | Image (tag SHA) |'
            echo '|---|---|'
            jq -r '.services | to_entries[] | "| \(.key) | `\(.value[0:12])` |"' "$RUNNER_TEMP/release.json" 2>/dev/null || true
            echo ""
            echo "Bước tiếp: \`git tag ${GITHUB_REF_NAME#rc-} $GITHUB_SHA && git push origin ${GITHUB_REF_NAME#rc-}\` → cd-prod (chờ duyệt)."
          } >> "$GITHUB_STEP_SUMMARY"
