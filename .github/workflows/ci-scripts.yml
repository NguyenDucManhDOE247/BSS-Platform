name: CI — scripts

# Test cho scripts/release-manifest.sh — trái tim của CD (ADR-005). Chạy khi đụng script hoặc
# overlay/base K8s (bài test `render` build overlay dev thật bằng `kubectl kustomize`).
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'infrastructure/kubernetes/**'
      - '.github/workflows/ci-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'infrastructure/kubernetes/**'

permissions:
  contents: read

concurrency:
  group: ci-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shellcheck + test release-manifest/smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck, jq, kubectl, git đều có sẵn trên ubuntu-latest — không cần cài thêm.
      # `-S warning`: chỉ fail khi có warning/error (bỏ qua mức info/style của các script cũ).
      # B-07 tái phát 2026-09-30: 4 script tạo trên Windows vào git với mode 100644 → `./scripts/x.sh` báo
      # "Permission denied" trên Linux/WSL (chỉ lộ khi làm theo tài liệu từ một clone sạch). Chặn ở đây.
      - name: Mọi *.sh trong git phải có bit thực thi (100755)
        run: |
          bad="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')"
          if [ -n "$bad" ]; then
            echo "::error::Thiếu bit thực thi — sửa bằng: git update-index --chmod=+x <file>"; echo "$bad"; exit 1
          fi

      - name: shellcheck
        run: shellcheck -x -S warning scripts/e2e-flow.sh scripts/e2e-kind.sh scripts/e2e-browser.sh scripts/admin-user.sh scripts/lib/keycloak.sh scripts/release-manifest.sh scripts/smoke.sh scripts/test-alert-rules.sh scripts/monitoring-install.sh scripts/tracing-install.sh scripts/logging-install.sh scripts/auth-install.sh scripts/e2e-local.sh scripts/kind-up.sh scripts/netpol-matrix.sh scripts/chaos-az-outage.sh scripts/lab-keycloak-db-failover.sh scripts/tests/*.sh

      - name: Test release-manifest.sh
        run: ./scripts/tests/release-manifest.test.sh

      # Hồi quy B-52: smoke.sh PHẢI exit 1 khi endpoint hỏng (bản cũ nuốt lỗi, không bao giờ fail).
      - name: Test smoke.sh
        run: ./scripts/tests/smoke.test.sh
