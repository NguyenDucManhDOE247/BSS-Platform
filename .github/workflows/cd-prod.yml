name: CD — prod

# Tag `vX.Y.Z` → prod, SAU KHI người duyệt bấm Approve (GitHub Environment `production` có Required
# reviewers). Thiết kế: ADR-005 + ADR-006.
#
# Prod nhận ĐÚNG những image đã chạy trên staging — không build lại, không "gần giống":
#   check  (không cần AWS, chạy TRƯỚC khi xin duyệt — đừng bắt người duyệt xem một bản đã chắc chắn hỏng)
#     • tag vX.Y.Z phải nằm trong lịch sử main;
#     • releases/rc-vX.Y.Z.json phải tồn tại và `verified_in` chứa "staging" (tức rc đã deploy + smoke PASS);
#     • tag vX.Y.Z phải trỏ ĐÚNG commit của rc-vX.Y.Z (source.sha của manifest rc).
#   deploy (environment: production → chờ duyệt)
#     • `aws ecr put-image` gắn tag vX.Y.Z lên cùng 8 digest (7 service + keycloak); deploy; smoke; rollback về prod.json cũ nếu hỏng;
#       PASS → ghi prod.json + releases/vX.Y.Z.json.
#
# Chạy lại / dựng lại cluster prod (ADR-006, ephemeral): Actions → CD — prod → Run workflow, chọn
# "Tag: vX.Y.Z" làm ref.
#
# Cần: GitHub Environment `production` (Required reviewers; deployment tag policy `v*`; variable
# AWS_ROLE_ARN = role bss-github-deployer-prod), repository variable ECR_REGISTRY — docs/SETUP.md Part 6.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER: bss-prod-eks
  CD_RUNNER: bss-prod-gha-runner # project CodeBuild (modules/ci-runner) — cùng tên trong `runs-on` của job deploy
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  check:
    name: Cổng kiểm — rc đã qua staging chưa?
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rc_tag: ${{ steps.gate.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Kiểm tra
        id: gate
        run: |
          rc_tag="rc-$GITHUB_REF_NAME"
          echo "rc_tag=$rc_tag" >> "$GITHUB_OUTPUT"

          scripts/release-manifest.sh on-main "$GITHUB_SHA"

          rc=0
          scripts/release-manifest.sh state-get "releases/$rc_tag.json" > "$RUNNER_TEMP/rc.json" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::Chưa có releases/$rc_tag.json — chưa từng promote $rc_tag lên staging. Đặt tag $rc_tag trên đúng commit này trước, đợi CD staging xanh."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::state-get thất bại (exit $rc)"; exit "$rc"
          fi
          scripts/release-manifest.sh validate "$RUNNER_TEMP/rc.json"

          # rc đã verified_in staging + tag v trỏ đúng commit của rc (source.sha)
          scripts/release-manifest.sh gate-prod "$RUNNER_TEMP/rc.json" "$GITHUB_SHA"
          echo "✓ $rc_tag đã qua staging, cùng commit ${GITHUB_SHA::7} — sẵn sàng xin duyệt."

  # Job deploy chạy trên runner CodeBuild TRONG VPC của prod (ADR-013) để gọi API server qua endpoint private —
  # endpoint public của EKS không còn phải mở cho runner của GitHub. Môi trường là ephemeral: chưa dựng thì project
  # runner không tồn tại và job deploy sẽ nằm chờ runner vô thời hạn. Job này (runner của GitHub, role chỉ-đọc
  # bss-github-cd-preflight) báo lỗi rõ ràng TRƯỚC khi điều đó xảy ra.
  runner:
    name: Cluster + runner trong VPC đã sẵn sàng?
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PREFLIGHT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Kiểm tra
        run: |
          if ! status="$(aws eks describe-cluster --name "$EKS_CLUSTER" --query cluster.status --output text 2>&1)"; then
            if grep -q ResourceNotFoundException <<<"$status"; then
              echo "::error::Cluster $EKS_CLUSTER chưa được dựng (prod là ephemeral — ADR-006). Dựng theo docs/runbooks/cd-staging-prod-demo.md rồi chạy lại workflow này trên chính tag ${GITHUB_REF_NAME}."
            else
              echo "::error::Không hỏi được trạng thái $EKS_CLUSTER: $status"
            fi
            exit 1
          fi
          [ "$status" = ACTIVE ] || { echo "::error::Cluster $EKS_CLUSTER đang $status — chờ ACTIVE rồi chạy lại."; exit 1; }
          found="$(aws codebuild batch-get-projects --names "$CD_RUNNER" --query 'projects[0].name' --output text)"
          [ "$found" = "$CD_RUNNER" ] || { echo "::error::Chưa có project CodeBuild $CD_RUNNER (runner CD trong VPC). State shared đã có kết nối GitHub AVAILABLE chưa? — docs/runbooks/cd-runner.md"; exit 1; }
          echo "✓ $EKS_CLUSTER ACTIVE, runner $CD_RUNNER sẵn sàng"

  deploy:
    name: Promote ${{ github.ref_name }} → prod
    needs: [check, runner]
    # `runs-on` không đọc được context `env` → tên project lặp lại ở đây (phải khớp env.CD_RUNNER).
    runs-on: codebuild-bss-prod-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    environment: production # ← Required reviewers: job dừng ở đây cho tới khi có người Approve
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Image CodeBuild có sẵn git/jq/aws/curl nhưng kubectl của nó cũ hơn cluster nhiều bản — cài đúng bản
      # (kustomize đi kèm trong kubectl). Kiểm sha256 vì đây là binary sẽ cầm quyền deploy.
      - name: kubectl đúng bản cluster
        env:
          KUBECTL_VERSION: v1.34.11
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Manifest prod = bản rc đã qua staging
        id: manifests
        env:
          RC_TAG: ${{ needs.check.outputs.rc_tag }}
        run: |
          # Đọc lại (job check chạy ở runner khác) và dựng manifest prod từ ĐÚNG manifest rc đóng băng.
          scripts/release-manifest.sh state-get "releases/$RC_TAG.json" > "$RUNNER_TEMP/prod.json"
          scripts/release-manifest.sh set-field "$RUNNER_TEMP/prod.json" environment prod
          scripts/release-manifest.sh set-field "$RUNNER_TEMP/prod.json" release "$GITHUB_REF_NAME"
          scripts/release-manifest.sh validate "$RUNNER_TEMP/prod.json"

          missing="$(scripts/release-manifest.sh ecr-missing "$RUNNER_TEMP/prod.json")"
          if [ "$missing" != "[]" ]; then
            echo "::error::Image bị mất khỏi ECR: $missing (lifecycle policy đã xóa? — tag rc-v*/v* lẽ ra được bảo vệ)."
            exit 1
          fi

          # `previous`: last-known-good, hoặc RỖNG nếu chưa có / manifest cũ trước ADR-011 (thiếu keycloak).
          previous="$(scripts/release-manifest.sh previous prod.json "$RUNNER_TEMP/previous.json")"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          [ -n "$previous" ] || echo "::notice::Không có last-known-good dùng được cho prod (lần deploy đầu, hoặc manifest cũ trước ADR-011) — lần này không thể rollback."
          echo "Thay đổi so với prod hiện tại:"
          scripts/release-manifest.sh diff "$RUNNER_TEMP/previous.json" "$RUNNER_TEMP/prod.json" || true

      - name: Gắn tag ${{ github.ref_name }} lên 8 image (aws ecr put-image)
        run: scripts/release-manifest.sh ecr-tag "$RUNNER_TEMP/prod.json" "$GITHUB_REF_NAME"

      - name: Deploy prod + smoke + rollback nếu hỏng
        uses: ./.github/actions/deploy-release
        with:
          environment: prod
          cluster: ${{ env.EKS_CLUSTER }}
          registry: ${{ env.ECR_REGISTRY }}
          manifest: ${{ runner.temp }}/prod.json
          previous-manifest: ${{ steps.manifests.outputs.previous }}
          region: ${{ env.AWS_REGION }}

      - name: Ghi manifest (prod.json + releases/${{ github.ref_name }}.json)
        run: |
          scripts/release-manifest.sh add-verified "$RUNNER_TEMP/prod.json" prod
          scripts/release-manifest.sh state-put "release($GITHUB_REF_NAME): prod OK" \
            "prod.json=$RUNNER_TEMP/prod.json" \
            "releases/$GITHUB_REF_NAME.json=$RUNNER_TEMP/prod.json"

      - name: Tóm tắt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RC_TAG: ${{ needs.check.outputs.rc_tag }}
        run: |
          {
            echo "### CD prod — $JOB_STATUS"
            echo ""
            echo "Release \`$GITHUB_REF_NAME\` (= \`$RC_TAG\` đã qua staging, commit \`${GITHUB_SHA::7}\`) → cluster \`$EKS_CLUSTER\`"
            echo ""
            echo '| Service | Image (tag SHA) |'
            echo '|---|---|'
            jq -r '.services | to_entries[] | "| \(.key) | `\(.value[0:12])` |"' "$RUNNER_TEMP/prod.json" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
