name: CI — backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/bss-common-java/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/bss-common-java/**'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            customer-service: 'apps/backend/customer-service/**'
            product-catalog:  'apps/backend/product-catalog/**'
            order-management: 'apps/backend/order-management/**'
            billing-service:  'apps/backend/billing-service/**'
            api-gateway:      'apps/backend/api-gateway/**'

  build-and-test:
    name: Build + test ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify
        working-directory: apps/backend/${{ matrix.service }}
        run: mvn -B verify

      - name: Build container image (no push)
        working-directory: apps/backend/${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:ci .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
