name: CI — backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/bss-common-java/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/bss-common-java/**'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3.0.4
        with:
          filters: |
            customer-service:  'apps/backend/customer-service/**'
            product-catalog:   'apps/backend/product-catalog/**'
            order-management:  'apps/backend/order-management/**'
            billing-service:   'apps/backend/billing-service/**'
            api-gateway:       'apps/backend/api-gateway/**'
            bss-common-java:   'packages/bss-common-java/**'

      # B-53: `packages/bss-common-java/**` is in this workflow's own `on.paths` trigger (a
      # shared library change should re-verify every consumer), but it isn't a directory under
      # `apps/backend/`, so it never matched any of the 5 per-service filters above — the
      # workflow would run, `filter.outputs.changes` would be an empty array, and the
      # build-and-test job's `if: needs.detect.outputs.services != '[]'` would skip it entirely.
      # A change to the shared library silently verified nothing. Expand it into the full
      # service list here instead of matching it as a "service".
      - id: matrix
        run: |
          changes='${{ steps.filter.outputs.changes }}'
          if echo "$changes" | grep -q '"bss-common-java"'; then
            echo 'services=["customer-service","product-catalog","order-management","billing-service","api-gateway"]' >> "$GITHUB_OUTPUT"
          else
            echo "services=$changes" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build + test ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    permissions:
      contents: read
      packages: read # customer-service resolves com.bss:bss-common-java from GitHub Packages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github # writes ~/.m2/settings.xml auth for the <repository id="github"> below

      - name: Maven verify
        working-directory: apps/backend/${{ matrix.service }}
        run: mvn -B verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image (no push)
        working-directory: apps/backend/${{ matrix.service }}
        # --secret: only customer-service's Dockerfile actually mounts `id=github_token` (to
        # resolve com.bss:bss-common-java from GitHub Packages inside the isolated build
        # environment — see its Dockerfile) — passing it uniformly across the matrix is
        # harmless for the other 4 services, whose Dockerfiles never reference the secret.
        run: docker build --secret id=github_token,env=GITHUB_TOKEN -t ${{ matrix.service }}:ci .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan
        # B-54: was pinned to tag "0.20.0" (no "v" prefix, and long since removed from the repo's
        # release list) — CI failed with "Unable to resolve action ... unable to find version".
        # Pinned by commit SHA instead of a tag, per B-54's own warning about supply-chain risk on
        # tag-pinned third-party actions (the tj-actions/changed-files incident, March 2025).
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
